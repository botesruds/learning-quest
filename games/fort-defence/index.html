<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2b6fd6">
<title>Fort Defence</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/learn.css">
<script src="../../shared/family.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
:root{
  --ink:#1b2236; --paper:#fffaf0; --go:#2fbf4a; --go-d:#1d8a33; --blue:#2b6fd6; --blue-d:#1b4ea3; --gold:#ffc83d; --gold-d:#d39a12;
  --red:#e8463b; --purple:#7c4dff; --shadow:0 6px 0 rgba(0,0,0,.25);
  --f-game:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;color:var(--ink);font:18px/1.45 var(--f-body);overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#ui > *{pointer-events:auto}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;font:20px var(--f-game);letter-spacing:.02em;box-shadow:var(--shadow);border:3px solid #fff;color:var(--ink);text-decoration:none;min-height:48px}
button.chip{cursor:pointer}
.chip.icon{width:52px;justify-content:center;padding:0;font-size:24px}
.save-dot{width:14px;height:14px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(47,191,74,.25)}
.save-dot.wait{background:var(--gold)} .save-dot.bad{background:var(--red)}
.chip .lbl{font:700 15px var(--f-body)}
.btn{font:26px var(--f-game);letter-spacing:.03em;color:#fff;border:0;border-radius:18px;padding:16px 34px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(#41d65d,var(--go));box-shadow:0 7px 0 var(--go-d),0 12px 24px rgba(0,0,0,.25);transition:transform .08s, box-shadow .08s;min-height:60px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--go-d),0 6px 12px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#4a8cf0,var(--blue));box-shadow:0 7px 0 var(--blue-d),0 12px 24px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(#ffd965,var(--gold));color:#5a3a00;text-shadow:none;box-shadow:0 7px 0 var(--gold-d),0 12px 24px rgba(0,0,0,.25)}
.btn.small{font-size:19px;padding:10px 18px;min-height:48px;border-radius:14px}
.btn:focus-visible,.chip:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn.pulse{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 7px 0 var(--go-d),0 12px 24px rgba(0,0,0,.25),0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 7px 0 var(--go-d),0 12px 24px rgba(0,0,0,.25),0 0 0 12px rgba(255,255,255,0)}}
.title{margin:auto auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:4vh}
.logo{font:clamp(54px,11vw,112px)/.9 var(--f-game);color:#fff;letter-spacing:.02em;margin:0;
  text-shadow:0 4px 0 #2a55b8,0 8px 0 #1c3c86,0 14px 22px rgba(0,0,0,.35);-webkit-text-stroke:2px #1c3c86;transform:rotate(-2deg)}
.logo span{color:var(--gold);-webkit-text-stroke:2px #8a5a00;text-shadow:0 4px 0 #b77c0c,0 8px 0 #8a5a00,0 14px 22px rgba(0,0,0,.35)}
.tag{font:22px var(--f-game);color:#fff;background:rgba(27,34,54,.55);padding:6px 16px;border-radius:12px;margin:0}
.panel{background:var(--paper);border-radius:22px;border:4px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.25);padding:20px 22px;max-width:560px}
.panel h2{font:30px var(--f-game);margin:0 0 6px;letter-spacing:.02em}
.panel p{margin:6px 0}
.center{margin:auto;text-align:center}
.bottom{margin:auto auto 2vh;text-align:center}
.banner{align-self:center;margin-top:10px;background:rgba(124,77,255,.92);color:#fff;font:700 15px var(--f-body);padding:6px 14px;border-radius:12px;box-shadow:var(--shadow)}
.toast{position:fixed;pointer-events:none;left:50%;top:132px;max-width:min(560px,calc(100vw - 32px));text-align:center;transform:translateX(-50%);z-index:20;background:#1b2236;color:#fff;padding:12px 18px;border-radius:14px;font:700 17px var(--f-body);box-shadow:var(--shadow);animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,-14px);opacity:0}}
.fade-in{animation:fadein .5s ease-out both}
.dawn{align-self:center;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(620px,100%);width:100%;padding:16px 18px 18px}
.dawn .dsub{margin:0;font:700 16px var(--f-body);color:#5b5446}
.dawn .go-day{font-size:clamp(22px,4.4vw,30px);padding:16px 26px;max-width:100%;white-space:normal;line-height:1.15}
.dawn .drow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dawn .go-day.night{background:linear-gradient(#5b4bd6,#3a2d9c);box-shadow:0 7px 0 #241a6b,0 12px 24px rgba(0,0,0,.25)}
.btn.libbtn{position:relative}.btn.libbtn .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff5a3c;border:2px solid #fff;box-shadow:0 0 0 0 rgba(255,90,60,.6);animation:libpulse 1.6s infinite}@keyframes libpulse{70%{box-shadow:0 0 0 9px rgba(255,90,60,0)}100%{box-shadow:0 0 0 0 rgba(255,90,60,0)}}
.btn.crackbtn{background:linear-gradient(#b388ff,#7c4dff);box-shadow:0 5px 0 #4b2aa8}
.chip.nightchip{background:#3a2d9c;color:#fff;border-color:#b3a6ff;animation:glow 1.6s ease-in-out infinite}
/* the night */
.nightbar{align-self:center;margin-top:8px;pointer-events:none!important}
.chip.nightcount,.chip.nighttitle{background:rgba(20,18,50,.82);color:#fff;border-color:rgba(255,255,255,.5);font-size:18px}
.chip.nighttitle{font:700 16px var(--f-body)}
.runebtn{align-self:center;background:linear-gradient(#7ff0ff,#2cb7d6);color:#063040;text-shadow:none;box-shadow:0 7px 0 #1a7c93,0 12px 24px rgba(0,0,0,.35);font-size:28px;opacity:.55}
.runebtn.ready{opacity:1;animation:runeglow 1.1s ease-in-out infinite}
.runebtn:disabled{cursor:default;filter:none}
@keyframes runeglow{50%{box-shadow:0 7px 0 #1a7c93,0 0 0 10px rgba(127,240,255,.35),0 12px 34px rgba(127,240,255,.6)}}
.freeze{position:fixed;inset:0;z-index:30;background:rgba(60,120,230,.28);backdrop-filter:saturate(.5) brightness(.9);-webkit-backdrop-filter:saturate(.5) brightness(.9);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 14px;overflow:auto;animation:fadein .25s ease-out}
.runecard{width:min(680px,100%);max-height:100%;overflow:auto;border-radius:22px;background:var(--paper);box-shadow:0 0 0 4px #c8fbff,0 0 50px rgba(127,240,255,.7);padding:6px}
.runecard .card{border:0}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}}
.loading{margin:auto;font:28px var(--f-game);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
#bench{position:fixed;right:12px;top:80px;z-index:30;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;font-size:14px;padding:14px}
#bench h3{font:20px var(--f-game);margin:4px 0 6px}
#bench .row{display:flex;flex-wrap:wrap;gap:6px}
#bench button{font:700 13px var(--f-body);border:2px solid #d6d0c4;background:#fff;border-radius:10px;padding:6px 9px;cursor:pointer}
#bench pre{white-space:pre-wrap;background:#f0ebe0;border-radius:8px;padding:8px;font-size:12px;max-height:160px;overflow:auto}

/* ---------- build screen ---------- */
.grow{flex:1;pointer-events:none!important}
.mats{pointer-events:none!important;align-self:center;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.mat{display:inline-flex;align-items:center;gap:5px;background:rgba(27,34,54,.78);color:#fff;border-radius:12px;padding:5px 11px;font:20px var(--f-game);box-shadow:0 4px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.mat .mi{font-size:18px}
.mission{pointer-events:none!important;align-self:center;margin-top:8px;background:rgba(255,250,240,.95);border-radius:14px;padding:8px 16px;box-shadow:var(--shadow);font-size:17px;max-width:min(640px,92vw);text-align:center}
.tray{position:relative;max-width:none;padding:10px 12px 12px;border-radius:20px;width:100%;transition:background .15s, border-color .15s}
.tray .tabs{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tab{font:19px var(--f-game);letter-spacing:.02em;border:3px solid #e6dcc8;background:#fff;color:var(--ink);border-radius:12px;padding:6px 14px;cursor:pointer;min-height:44px}
.tab.on{background:var(--blue);border-color:var(--blue-d);color:#fff}
.tray .hint{color:#6b6250;font-size:15px;margin-left:4px}
.tray .done{margin-left:auto}
.items{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;touch-action:pan-x;scrollbar-width:thin}
.item{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid #e6dcc8;border-radius:16px;padding:6px 4px 8px;cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none;color:var(--ink);font:inherit;position:relative}
.item:hover{border-color:var(--blue)}
.item.sel{border-color:var(--go);box-shadow:0 0 0 4px rgba(47,191,74,.35);background:#effbea}
.item.poor{opacity:.55}
.item img{width:84px;height:84px;pointer-events:none;-webkit-user-drag:none}
.item .nm{font:16px var(--f-game);letter-spacing:.02em;line-height:1.1;text-align:center}
.cost{display:inline-flex;gap:6px;font:700 14px var(--f-body);flex-wrap:wrap;justify-content:center}
.cost .c.short{color:var(--red)}
.item .bp{position:absolute;top:4px;right:4px;background:var(--gold);color:#5a3a00;font:700 11px var(--f-body);border-radius:8px;padding:1px 5px}
.item .bp.none{background:#ddd;color:#666}
.drophere{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;font:26px var(--f-game);color:#fff;border-radius:inherit;pointer-events:none}
.tray.pickup .tabs,.tray.pickup .items{visibility:hidden}
.tray.pickup .drophere{display:flex}
.tray.pickup{background:rgba(43,111,214,.9);border-color:#fff}
.tray.pickup.hot{background:var(--go)}
.popup{position:fixed;left:50%;bottom:max(200px,26vh);transform:translateX(-50%);z-index:15;width:min(440px,calc(100vw - 32px));padding:14px 16px}
.popup .pophead{display:flex;gap:12px;align-items:center}
.popup img{width:72px;height:72px;flex:none}
.popup b{font:24px var(--f-game);letter-spacing:.02em}
.popup .tip{font-size:15px;color:#5b5446}
.popup .lvl{display:flex;gap:4px;margin:2px 0}
.popup .lvl i{width:22px;height:8px;border-radius:4px;background:#e2d8c4}
.popup .lvl i.on{background:var(--gold)}
.popbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.popbtns .maxed{font:18px var(--f-game);color:var(--gold-d)}
.btn.plain{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #d8cfbd;border:2px solid #e6dcc8}
.btn[disabled]{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.btn .cost{margin-left:6px;color:inherit}
#bench.min > :not(:first-child):not(h3){display:none}
@media (max-width:700px){.item{width:96px}.item img{width:70px;height:70px}.mat{font-size:17px;padding:4px 9px}.tray .hint{display:none}}
@media (prefers-reduced-motion: reduce){.btn.pulse{animation:none}*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Your fort"></canvas>
<div id="ui"><div class="loading">Loading your fort…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
