<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2b6fd6">
<title>Fort Defence</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<script src="../../shared/family.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
:root{
  --ink:#1b2236; --paper:#fffaf0; --go:#2fbf4a; --go-d:#1d8a33; --blue:#2b6fd6; --blue-d:#1b4ea3; --gold:#ffc83d; --gold-d:#d39a12;
  --red:#e8463b; --purple:#7c4dff; --shadow:0 6px 0 rgba(0,0,0,.25);
  --f-game:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;color:var(--ink);font:18px/1.45 var(--f-body);overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#ui > *{pointer-events:auto}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;font:20px var(--f-game);letter-spacing:.02em;box-shadow:var(--shadow);border:3px solid #fff;color:var(--ink);text-decoration:none;min-height:48px}
button.chip{cursor:pointer}
.chip.icon{width:52px;justify-content:center;padding:0;font-size:24px}
.save-dot{width:14px;height:14px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(47,191,74,.25)}
.save-dot.wait{background:var(--gold)} .save-dot.bad{background:var(--red)}
.chip .lbl{font:700 15px var(--f-body)}
.btn{font:26px var(--f-game);letter-spacing:.03em;color:#fff;border:0;border-radius:18px;padding:16px 34px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(#41d65d,var(--go));box-shadow:0 7px 0 var(--go-d),0 12px 24px rgba(0,0,0,.25);transition:transform .08s, box-shadow .08s;min-height:60px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--go-d),0 6px 12px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#4a8cf0,var(--blue));box-shadow:0 7px 0 var(--blue-d),0 12px 24px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(#ffd965,var(--gold));color:#5a3a00;text-shadow:none;box-shadow:0 7px 0 var(--gold-d),0 12px 24px rgba(0,0,0,.25)}
.btn.small{font-size:19px;padding:10px 18px;min-height:48px;border-radius:14px}
.btn:focus-visible,.chip:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn.pulse{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 7px 0 var(--go-d),0 12px 24px rgba(0,0,0,.25),0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 7px 0 var(--go-d),0 12px 24px rgba(0,0,0,.25),0 0 0 12px rgba(255,255,255,0)}}
.title{margin:auto auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:4vh}
.logo{font:clamp(54px,11vw,112px)/.9 var(--f-game);color:#fff;letter-spacing:.02em;margin:0;
  text-shadow:0 4px 0 #2a55b8,0 8px 0 #1c3c86,0 14px 22px rgba(0,0,0,.35);-webkit-text-stroke:2px #1c3c86;transform:rotate(-2deg)}
.logo span{color:var(--gold);-webkit-text-stroke:2px #8a5a00;text-shadow:0 4px 0 #b77c0c,0 8px 0 #8a5a00,0 14px 22px rgba(0,0,0,.35)}
.tag{font:22px var(--f-game);color:#fff;background:rgba(27,34,54,.55);padding:6px 16px;border-radius:12px;margin:0}
.panel{background:var(--paper);border-radius:22px;border:4px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.25);padding:20px 22px;max-width:560px}
.panel h2{font:30px var(--f-game);margin:0 0 6px;letter-spacing:.02em}
.panel p{margin:6px 0}
.center{margin:auto;text-align:center}
.bottom{margin:auto auto 2vh;text-align:center}
.banner{align-self:center;margin-top:10px;background:rgba(124,77,255,.92);color:#fff;font:700 15px var(--f-body);padding:6px 14px;border-radius:12px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;background:#1b2236;color:#fff;padding:12px 18px;border-radius:14px;font:700 17px var(--f-body);box-shadow:var(--shadow);animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.fade-in{animation:fadein .5s ease-out both}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}}
.loading{margin:auto;font:28px var(--f-game);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
#bench{position:fixed;right:12px;bottom:12px;z-index:30;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;font-size:14px;padding:14px}
#bench h3{font:20px var(--f-game);margin:4px 0 6px}
#bench .row{display:flex;flex-wrap:wrap;gap:6px}
#bench button{font:700 13px var(--f-body);border:2px solid #d6d0c4;background:#fff;border-radius:10px;padding:6px 9px;cursor:pointer}
#bench pre{white-space:pre-wrap;background:#f0ebe0;border-radius:8px;padding:8px;font-size:12px;max-height:160px;overflow:auto}
@media (prefers-reduced-motion: reduce){.btn.pulse{animation:none}*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Your fort"></canvas>
<div id="ui"><div class="loading">Loading your fort…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
