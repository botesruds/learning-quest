<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra Quest</title>
<meta name="robots" content="noindex,nofollow">
<script src="../../shared/family.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E6ECF4; --ink:#141C2B; --muted:#55617A; --line:#CDD7E5; --grid:rgba(31,79,184,.07);
  --accent:#1F4FB8; --accent-ink:#FFFFFF; --accent-soft:#DCE6FA;
  --c1:#2E5FB8; --c2:#0B8577; --c3:#B4560F; --c4:#7A45C9; --c5:#BF3B5E;
  --good:#1C8548; --warn:#B07210; --bad:#BF342C; --grey:#9AA5B8;
  --xt:#2E7BD6; --yt:#16A07F; --x2t:#7A45C9; --one:#E3A21A; --neg:#D9483F;
  --f-display:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#151D31; --surface-2:#1E2840; --ink:#E5EBF6; --muted:#97A3BC; --line:#2C3853; --grid:rgba(126,166,242,.06);
  --accent:#7EA6F2; --accent-ink:#0E1424; --accent-soft:#22325A;
  --c1:#7EA6F2; --c2:#45C7B5; --c3:#E8A05C; --c4:#B48DF0; --c5:#F07C9C;
  --good:#4CC17F; --warn:#E2B04A; --bad:#F06C61; --grey:#5D6A82;
  --xt:#6FA8F0; --yt:#45C7A5; --x2t:#B48DF0; --one:#F0BE4A; --neg:#F06C61;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#151D31; --surface-2:#1E2840; --ink:#E5EBF6; --muted:#97A3BC; --line:#2C3853; --grid:rgba(126,166,242,.06);
  --accent:#7EA6F2; --accent-ink:#0E1424; --accent-soft:#22325A;
  --c1:#7EA6F2; --c2:#45C7B5; --c3:#E8A05C; --c4:#B48DF0; --c5:#F07C9C;
  --good:#4CC17F; --warn:#E2B04A; --bad:#F06C61; --grey:#5D6A82;
  --xt:#6FA8F0; --yt:#45C7A5; --x2t:#B48DF0; --one:#F0BE4A; --neg:#F06C61;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.gut{padding-left:16px;padding-right:16px}
.wrap{max-width:900px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.m{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.x{color:var(--xt);font-weight:700}

/* header */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;cursor:pointer;padding:0}
.brand .sq{min-width:36px;padding:0 6px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand b{font-family:var(--f-display);font-size:1.12rem;font-weight:800}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.tab:hover{color:var(--ink)}
@media (max-width:520px){.tab{padding:6px 7px;font-size:.88rem}}
main{padding-block:22px 64px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card > * + *{margin-top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:700;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 11px;font-size:.88rem}
.btn.big{padding:14px 22px;font-size:1.08rem}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* save bar */
.keep{background:var(--surface-2);border-bottom:1px solid var(--line)}
.keep .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px;font-size:.92rem}
.keep .msg{flex:1 1 260px}
.keep[data-state="dirty"]{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.keep[data-state="auto"]{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.keep[data-state="fresh"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.savechip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.85rem;cursor:pointer}
.savechip i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.savechip[data-state="dirty"] i{background:var(--warn)}
.savechip[data-state="fresh"] i{background:var(--grey)}
.welcome{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.welcome .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.welcome .opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}

/* RAG */
.ragdot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;background:var(--grey)}
.rag-green{background:var(--good)} .rag-amber{background:var(--warn)} .rag-red{background:var(--bad)} .rag-none{background:var(--grey)} .rag-started{background:transparent;border:2px solid var(--grey)}
.ragpill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--surface-2)}
.ragpill.rag-green,.ragpill.rag-amber,.ragpill.rag-red,.ragpill.rag-none,.ragpill.rag-started{background:var(--surface-2)}
.ragbar{display:flex;gap:4px;flex-wrap:wrap}
.ragbar i{flex:1 1 18px;min-width:14px;height:14px;border-radius:4px;display:block}
.rdots{display:inline-flex;gap:3px}
.rdots i{width:12px;height:12px;border-radius:3px;display:block}
.rdots .own{background:var(--good)} .rdots .stp{border:2px solid var(--good)} .rdots .hlp{background:var(--warn)} .rdots .bad{background:var(--bad)}

/* path */
.stage{--cc:var(--c1);border-left:4px solid var(--cc);padding-left:14px;display:flex;flex-direction:column;gap:12px}
.stage h2{color:var(--cc)}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{--cc:var(--c1);position:relative;text-align:left;border:1.5px solid color-mix(in srgb,var(--cc) 50%,var(--line));background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:112px;min-width:0;box-shadow:0 3px 0 color-mix(in srgb,var(--cc) 40%,var(--line))}
.tile:hover{background:color-mix(in srgb,var(--cc) 8%,var(--surface))}
.tile .z{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--cc);line-height:1}
.tile .nm{font-size:.88rem;line-height:1.3;font-weight:700}
.tile .kind{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .ragdot{position:absolute;top:10px;right:10px}
.tile.locked{opacity:.55;box-shadow:none;border-style:dashed}
.tile.locked .z::after{content:" 🔒";font-size:.9rem}
.tile.preview{border-style:dotted;background:color-mix(in srgb,var(--cc) 6%,var(--surface))}
.tile.big{background:color-mix(in srgb,var(--cc) 10%,var(--surface))}
.tile.next{outline:3px solid var(--accent);outline-offset:2px}
.classnow{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;cursor:pointer}
.classnow input{width:20px;height:20px;accent-color:var(--accent)}

/* do next */
.donext{border:2px solid var(--accent);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donext .bigz{font-family:var(--f-display);font-weight:800;font-size:2.6rem;color:var(--accent);line-height:1;min-width:56px;text-align:center}
.donext .txt{flex:1 1 260px;display:flex;flex-direction:column;gap:4px}

/* lesson */
.lhead{display:flex;gap:14px;align-items:flex-start}
.lhead .z{font-family:var(--f-display);font-weight:800;font-size:2.2rem;color:var(--cc);line-height:1;min-width:48px}
.secs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.secs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.secs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.secs button .tick{color:var(--good)}
.secs button[aria-current="true"] .tick{color:inherit}
.chunkdots{display:flex;gap:5px;flex-wrap:wrap}
.chunkdots i{width:22px;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);display:block}
.chunkdots i.done{background:var(--good);border-color:var(--good)}
.chunkdots i.cur{background:var(--accent);border-color:var(--accent)}
.chunk{display:flex;flex-direction:column;gap:14px}
.chunk .body{font-size:1.08rem}
.chunk .body p + p{margin-top:8px}
.rule{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-weight:700;font-family:var(--f-display)}
.rule.small{font-size:.92rem;padding:6px 12px}
.why{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2);font-size:.98rem}
.vis{display:flex;justify-content:center;min-width:0;overflow-x:auto}
.vis svg{max-width:100%;height:auto;display:block}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.say{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted)}
.say:hover{color:var(--ink)}

/* questions */
.qs{font-family:var(--f-display);font-size:1.22rem;font-weight:500;line-height:1.45}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans{font-family:var(--f-mono);font-size:1.12rem;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1 1 160px;min-width:0;max-width:340px}
.ans.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.ans.no{border-color:var(--bad)}
.symkeys{display:flex;gap:4px;flex-wrap:wrap}
.symkeys button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-family:var(--f-mono);font-weight:700;padding:3px 9px;cursor:pointer;font-size:.92rem}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700;text-align:left;font-size:1rem}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.6}
.opts.col{flex-direction:column;align-items:stretch}
.verdict{border-radius:9px;padding:10px 13px;font-size:.98rem}
.verdict.good{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,var(--line))}
.verdict.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line))}
.verdict.mid{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.stepbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.stepbox.done{border-color:color-mix(in srgb,var(--good) 50%,var(--line));background:color-mix(in srgb,var(--good) 5%,var(--surface))}
.stepbox .sn{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--muted)}
.stepbox.locked{opacity:.4}
.qprog{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qprog i{width:16px;height:16px;border-radius:4px;background:var(--surface-2);border:1.5px solid var(--line);display:block}
.qprog i.own{background:var(--good);border-color:var(--good)}
.qprog i.stp{border-color:var(--good);border-width:3px}
.qprog i.hlp{background:var(--warn);border-color:var(--warn)}
.qprog i.bad{background:var(--bad);border-color:var(--bad)}
.hintbox{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));padding:10px 13px;border-radius:8px;display:flex;flex-direction:column;gap:8px}

/* tools */
.tool{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tool .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool select,.tool input[type=number]{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tool input[type=number]{width:80px}
.tool .out{font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.tbl{border-collapse:collapse;font-family:var(--f-mono)}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 10px;text-align:center;min-width:44px}
.tbl th{background:var(--surface-2);font-size:.85rem}
.tbl input{width:58px;font:inherit;text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:4px;background:var(--surface);color:var(--ink)}
.tbl input.ok{border-color:var(--good)} .tbl input.no{border-color:var(--bad)}
.scroll-x{overflow-x:auto;max-width:100%}
.kw{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kw div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kw b{font-family:var(--f-display);display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.small{font-size:.88rem}
.hide{display:none!important}
@media (prefers-reduced-motion: no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}}

/* ===== game ===== */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px}
.hud .brand{margin-right:auto}
.pillstat{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-weight:800;font-family:var(--f-display);background:var(--surface-2);border:1.5px solid var(--line);font-size:.95rem;cursor:default}
button.pillstat{cursor:pointer}
.pillstat.saved{color:var(--good)} .pillstat.unsaved{color:var(--warn)}
.gear{border:0;background:none;font-size:1.25rem;cursor:pointer;padding:4px 6px;border-radius:8px;opacity:.6}
.gear:hover{opacity:1}
.startscr{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.startscr h1{font-size:2.4rem}
.logo{font-size:4rem;line-height:1}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:min(420px,100%);padding:18px 24px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;border:0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bigbtn.go{background:var(--good);color:#fff}
.bigbtn.blue{background:var(--accent);color:var(--accent-ink)}
.bigbtn.plain{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.bigbtn:disabled{opacity:.5;cursor:default}
.avatars{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.avatars button{font-size:2.2rem;width:68px;height:68px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.avatars button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.avatars button .price{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:800;background:var(--one);color:#2a1b00;border-radius:99px;padding:0 6px;white-space:nowrap}
.avatars button.lockd{opacity:.55}
/* map */
.world{border-radius:20px;padding:16px 12px 8px;margin-bottom:18px;position:relative;border:2px solid color-mix(in srgb,var(--wc) 45%,var(--line));background:color-mix(in srgb,var(--wc) 9%,var(--surface))}
.world.lockedw{filter:grayscale(.85);opacity:.6}
.world h2{color:var(--wc);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.world .wsub{font-size:.9rem;color:var(--muted);margin:2px 0 6px}
.mapsvg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle.ring{stroke:var(--accent);stroke-width:5}
@media (prefers-reduced-motion: no-preference){ .pulse{animation:pulse 1.4s ease-in-out infinite} @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}} .bob{animation:bob 1.2s ease-in-out infinite} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} }
.playbar{position:sticky;bottom:0;z-index:4;padding:12px 0 16px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center}
/* level */
.lvtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvtop .x{font-size:1rem;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
.phases{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.ph{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 11px;font-weight:700;font-size:.85rem;background:var(--surface-2);color:var(--muted);border:1.5px solid transparent}
.ph.cur{background:var(--accent);color:var(--accent-ink)}
.ph.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.stars{font-size:1.4rem;letter-spacing:2px;white-space:nowrap}
.stars .off{filter:grayscale(1);opacity:.3}
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 16px}
.celebrate .bigstars{font-size:3.4rem;letter-spacing:6px}
.celebrate h1{font-size:2rem}
.savedok{color:var(--good);font-weight:800}
.gamepanel{display:flex;flex-direction:column;gap:14px}
.mission{border:2px dashed var(--accent);border-radius:14px;padding:12px 16px;background:var(--accent-soft);font-weight:700}
.coinpop{position:fixed;z-index:50;font-weight:800;font-family:var(--f-display);color:#B07210;pointer-events:none;font-size:1.2rem}
@media (prefers-reduced-motion: no-preference){.coinpop{animation:rise 1s ease-out forwards}@keyframes rise{to{transform:translateY(-50px);opacity:0}}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion: no-preference){#fx i{animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.badge{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--surface);font-size:.85rem;font-weight:700}
.badge .e{font-size:2rem;display:block}
.badge.no{opacity:.35;filter:grayscale(1)}
.repair{color:var(--warn);font-weight:800}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,15,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.overlay .card{max-width:620px;width:100%}
@media (max-width:520px){.hud .brand b{display:none}.hud{gap:6px}.hud .pillstat{padding:4px 9px;font-size:.92rem}.hud .gear{padding:2px}}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:700;max-width:min(92vw,520px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
</style>
</head>
<body>
<header class="bar" id="hud"></header>
<main class="gut"><div class="wrap" id="app"></div></main>
<div id="fx" aria-hidden="true"></div>
<input type="file" id="picker" accept=".json,application/json" hidden>
<script>
"use strict";
/* ================= helpers ================= */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k.startsWith("on")&&typeof v==="function") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
const H=(html,cls)=>h("div",{class:cls||"",html});
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const nz=(a,b)=>{let v=0;while(v===0)v=ri(a,b);return v;};
const MINUS="−";
const N=v=>{ if(typeof v!=="number") return String(v); const s=Number.isInteger(v)?String(v):String(+v.toFixed(4)); return s.replace("-",MINUS); };
const P=v=>v<0?`(${N(v)})`:N(v);           // number in brackets if negative
const sgn=v=>v<0?` ${MINUS} ${N(-v)}`:` + ${N(v)}`; // " + 3" / " − 3"
/* coefficient + letter: co(3,"x")="3x", co(1,"x")="x", co(-1,"x")="−x" */
const co=(c,v)=>c===1?v:c===-1?MINUS+v:N(c)+v;
/* linear a·v + b with nice signs */
function lin(a,v,b){
  let s=a===0?"":co(a,v);
  if(b){ s= s? s+sgn(b) : N(b); }
  return s||"0";
}
/* join terms [{c, v}] where v may be "" for constants */
function terms(list){
  let s="";
  for(const t of list){ if(!t.c) continue;
    const body= t.v? (Math.abs(t.c)===1? t.v : N(Math.abs(t.c))+t.v) : N(Math.abs(t.c));
    if(!s) s=(t.c<0?MINUS:"")+body; else s+= (t.c<0?` ${MINUS} `:" + ")+body;
  }
  return s||"0";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const M=s=>`<span class="m">${s}</span>`;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};

/* ================= expression parser ================= */
/* Accepts: numbers, single letters, + - − × * · / ÷ ^ ², brackets, implicit multiplication. */
function tokenize(src){
  let s=String(src).trim().replace(/\s+/g,"").replace(/[−–—]/g,"-").replace(/[×·*]/g,"*").replace(/÷/g,"/").replace(/²/g,"^2").replace(/³/g,"^3");
  const out=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){ let j=i; while(j<s.length&&/[0-9.]/.test(s[j])) j++; const t=s.slice(i,j); if((t.match(/\./g)||[]).length>1) throw new Error("num"); out.push({k:"n",v:parseFloat(t)}); i=j; continue; }
    if(/[a-zA-Z]/.test(c)){ out.push({k:"v",v:c}); i++; continue; }
    if("+-*/^()".includes(c)){ out.push({k:"o",v:c}); i++; continue; }
    if(c==="="){ out.push({k:"o",v:"="}); i++; continue; }
    throw new Error("bad char "+c);
  }
  // implicit multiplication
  const res=[];
  for(let j=0;j<out.length;j++){
    const a=res[res.length-1], b=out[j];
    if(a){ const aEnd=a.k==="n"||a.k==="v"||(a.k==="o"&&a.v===")"); const bStart=b.k==="n"||b.k==="v"||(b.k==="o"&&b.v==="(");
      if(aEnd&&bStart&&!(a.k==="n"&&b.k==="n")) res.push({k:"o",v:"*",imp:true}); }
    res.push(b);
  }
  return res;
}
function parse(src){
  const t=tokenize(src); let p=0;
  const peek=()=>t[p], eat=v=>{ if(t[p]&&t[p].v===v){p++;return true;} return false; };
  function expr(){ let n=term(); for(;;){ if(eat("+")) n={op:"+",a:n,b:term()}; else if(eat("-")) n={op:"-",a:n,b:term()}; else return n; } }
  function term(){ let n=unary(); for(;;){ if(eat("*")) n={op:"*",a:n,b:unary()}; else if(eat("/")) n={op:"/",a:n,b:unary()}; else return n; } }
  function unary(){ if(eat("-")) return {op:"neg",a:unary()}; if(eat("+")) return unary(); return pow(); }
  function pow(){ let b=atom(); if(eat("^")){ const e=unary(); return {op:"^",a:b,b:e}; } return b; }
  function atom(){ const k=peek(); if(!k) throw new Error("end");
    if(k.k==="n"){p++;return {n:k.v};} if(k.k==="v"){p++;return {v:k.v};}
    if(eat("(")){ const e=expr(); if(!eat(")")) throw new Error(")"); return {op:"()",a:e}; }
    throw new Error("unexpected "+k.v); }
  const tree=expr(); if(p<t.length) throw new Error("extra");
  return tree;
}
function evalT(n,env){
  if("n" in n) return n.n;
  if("v" in n){ const k=n.v; if(!(k in env)) throw new Error("var "+k); return env[k]; }
  switch(n.op){ case "+":return evalT(n.a,env)+evalT(n.b,env); case "-":return evalT(n.a,env)-evalT(n.b,env);
    case "*":return evalT(n.a,env)*evalT(n.b,env); case "/":return evalT(n.a,env)/evalT(n.b,env);
    case "^":return Math.pow(evalT(n.a,env),evalT(n.b,env)); case "neg":return -evalT(n.a,env); case "()":return evalT(n.a,env); }
}
function varsOf(n,set=new Set()){ if("v" in n) set.add(n.v); if(n.a) varsOf(n.a,set); if(n.b) varsOf(n.b,set); return set; }
function stripLHS(s){ s=String(s).trim(); const m=s.match(/^\s*([a-zA-Z])\s*=\s*(.+)$/); return m? m[2] : s; }
function numVal(s){ try{ const t=parse(stripLHS(s)); if(varsOf(t).size) return null; const v=evalT(t,{}); return isFinite(v)?v:null; }catch(e){ return null; } }
function equiv(a,b){
  let A,B; try{ A=parse(stripLHS(a)); B=parse(stripLHS(b)); }catch(e){ return false; }
  const vs=new Set([...varsOf(A),...varsOf(B)]);
  for(let k=0;k<6;k++){
    const env={}; for(const v of vs) env[v]=[1.37,2.91,-0.73,3.53,0.61,-1.83][(k+v.charCodeAt(0))%6]+k*0.17;
    let x,y; try{ x=evalT(A,env); y=evalT(B,env); }catch(e){ return false; }
    if(!isFinite(x)||!isFinite(y)) return false;
    if(Math.abs(x-y)>1e-7*Math.max(1,Math.abs(x),Math.abs(y))) return false;
  }
  return true;
}
/* "simplified" = no brackets, no ×/÷ signs, each top-level term has ≤1 number and each letter once, at most maxTerms terms */
function topTerms(src){
  const t=tokenize(stripLHS(src)); const list=[]; let cur=[], depth=0;
  t.forEach((k,i)=>{ if(k.v==="(")depth++; if(k.v===")")depth--;
    if(depth===0&&(k.v==="+"||k.v==="-")&&i>0&&!(t[i-1].k==="o"&&t[i-1].v!==")")){ list.push(cur); cur=[]; } else cur.push(k); });
  list.push(cur); return list.filter(x=>x.length);
}
function isSimplified(src,maxTerms){
  try{
    const t=tokenize(stripLHS(src));
    if(t.some(k=>k.v==="("||k.v===")"||(k.k==="o"&&!k.imp&&(k.v==="*"||k.v==="/")))) return false;
    const tt=topTerms(src); if(maxTerms!=null&&tt.length>maxTerms) return false;
    const sig=new Set();
    for(const term of tt){ const nums=term.filter((k,i)=>k.k==="n"&&!(i>0&&term[i-1].v==="^")); if(nums.length>1) return false;
      const letters=term.filter(k=>k.k==="v").map(k=>k.v); if(new Set(letters).size!==letters.length) return false;
      const key=letters.slice().sort().join("")+"|"+term.filter((k,i)=>i>0&&term[i-1].v==="^").map(k=>k.v).join(",");
      if(sig.has(key)) return false; sig.add(key); }
    return true;
  }catch(e){ return false; }
}
/* answer checking. spec: {num}, {expr, simp, terms}, {choice}, {any:[...]}, {words:[...]} */
function checkAns(spec,input){
  const s=String(input||"").trim(); if(!s) return {ok:false,empty:true};
  if("num" in spec){ const v=numVal(s); if(v==null) return {ok:false,msg:"Type a number (like 7, −3 or 2.5)."}; return {ok:Math.abs(v-spec.num)<1e-6}; }
  if("expr" in spec){
    let ok=false; try{ ok=equiv(s,spec.expr); }catch(e){}
    if(!ok){ try{ parse(stripLHS(s)); }catch(e){ return {ok:false,msg:"I couldn't read that. Use letters, numbers, + − and brackets."}; } return {ok:false}; }
    if(spec.simp && !isSimplified(s,spec.terms)) return {ok:false,close:true,msg:"That's equal, but not finished. Collect it into the simplest form."};
    if(spec.noBr && /[()]/.test(s)) return {ok:false,close:true,msg:"That's equal, but the brackets should be gone."};
    return {ok:true};
  }
  if("words" in spec){ const low=s.toLowerCase(); return {ok:spec.words.some(w=>low===w.toLowerCase())}; }
  return {ok:false};
}

/* ================= speech ================= */
function speakable(txt){
  return String(txt).replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ")
    .replace(/([a-z0-9)])²/gi,"$1 squared").replace(/\^2/g," squared")
    .replace(/−/g," minus ").replace(/×/g," times ").replace(/÷/g," divided by ").replace(/=/g," equals ")
    .replace(/(\d)([a-z])\b/g,"$1 $2").replace(/\bn\b/g,"n").replace(/\s+/g," ").trim();
}
function say(txt){ try{ const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(speakable(txt)); u.lang="en-GB"; u.rate=.92; s.speak(u); }catch(e){} }
function SayBtn(getText){ return h("button",{class:"say",type:"button",title:"Read this out loud",onclick:()=>say(typeof getText==="function"?getText():getText)},"🔊 Read"); }
/* ================= visuals (SVG) ================= */
const SV=(w,hh,inner,label)=>`<svg viewBox="0 0 ${w} ${hh}" width="${w}" height="${hh}" role="img" aria-label="${esc(label||"diagram")}" style="font-family:var(--f-mono)">${inner}</svg>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" dominant-baseline="central" style="fill:${o.fill||"var(--ink)"};font-size:${o.size||15}px;font-weight:${o.w||700};${o.style||""}">${esc(s)}</text>`;
function vis(svg,cls){ return h("div",{class:"vis "+(cls||""),html:svg}); }

/* ---- mystery bags and marbles ---- */
function bagSVG(x,y,label,col){
  col=col||"var(--xt)";
  return `<g transform="translate(${x},${y})"><path d="M14 10 Q8 0 18 2 L32 2 Q42 0 36 10 Q50 22 46 44 Q44 56 25 56 Q6 56 4 44 Q0 22 14 10 Z" style="fill:color-mix(in srgb,${col} 22%,var(--surface));stroke:${col};stroke-width:2.5"/><path d="M13 11 L37 11" style="stroke:${col};stroke-width:3"/>${T(25,36,label,{fill:col,size:20,style:"font-family:var(--f-display)"})}</g>`;
}
function dotsSVG(x,y,n,neg){
  let s=""; const cols=Math.min(n,5);
  for(let i=0;i<n;i++){ const cx=x+9+(i%cols)*19, cy=y+28+Math.floor(i/cols)*19-(n>5?9:0);
    s+=`<circle cx="${cx}" cy="${cy}" r="8" style="fill:${neg?"var(--neg)":"var(--one)"};stroke:color-mix(in srgb,var(--ink) 25%,transparent)"/>`; }
  return {s,w:cols*19+2};
}
/* items: "bag:n", "dots:3", "op:+", "txt:= 11" */
function bags(items,label){
  let x=6, s=""; const hh=66;
  for(const it of items){ const [k,v]=it.split(":");
    if(k==="bag"){ s+=bagSVG(x,4,v); x+=56; }
    else if(k==="dots"){ const d=dotsSVG(x,4,+v); s+=d.s; x+=d.w+8; }
    else if(k==="neg"){ const d=dotsSVG(x,4,+v,true); s+=d.s; x+=d.w+8; }
    else if(k==="op"){ s+=T(x+10,34,v,{size:24}); x+=24; }
    else if(k==="txt"){ s+=T(x,34,v,{a:"start",size:22,style:"font-family:var(--f-display)"}); x+=v.length*13+12; }
  }
  return vis(SV(x+6,hh,s,label||"bags and marbles"));
}

/* ---- algebra tiles ---- */
const TILE={x:{w:62,h:22,col:"var(--xt)"},y:{w:44,h:22,col:"var(--yt)"},x2:{w:44,h:44,col:"var(--x2t)"},"":{w:20,h:20,col:"var(--one)"}};
function tileSVG(x,y,v,neg,style){
  const t=TILE[style||v]||TILE[""]; const col=neg?"var(--neg)":t.col; const lab=v==="x2"?"x²":v;
  return `<g transform="translate(${x},${y})"><rect width="${t.w}" height="${t.h}" rx="4" style="fill:color-mix(in srgb,${col} ${neg?30:28}%,var(--surface));stroke:${col};stroke-width:2;${neg?"stroke-dasharray:5 3":""}"/>${lab||neg?T(t.w/2,t.h/2,(neg?"−":"")+lab,{fill:col,size:v===""?12:14}):""}</g>`;
}
/* groups: [{v:"x",c:3},{v:"",c:-2}] → drawn as clusters */
function tiles(groups,opts={}){
  let x=6,s=""; const hh=58;
  groups.forEach((g,gi)=>{
    const n=Math.abs(g.c), t=TILE[g.s||g.v]||TILE[""];
    if(gi>0 && opts.plus!==false){ s+=T(x+8,hh/2,"+",{size:18,fill:"var(--muted)"}); x+=20; }
    for(let i=0;i<n;i++){ s+=tileSVG(x,(hh-t.h)/2,g.v,g.c<0,g.s); x+=t.w+4; }
    if(opts.label){ s+=""; }
  });
  return vis(SV(x+6,hh,s,"algebra tiles"));
}

/* ---- number line with jumps ---- */
function numberLine(o){
  const min=o.min, max=o.max, W=Math.max(360,(max-min)*30+40), hh=110, y=74;
  const X=v=>20+(v-min)*(W-40)/(max-min);
  let s=`<line x1="10" y1="${y}" x2="${W-10}" y2="${y}" style="stroke:var(--ink);stroke-width:2"/>`;
  const stepL=(max-min)>26?5:(max-min)>16?2:1;
  for(let v=min;v<=max;v++){ const big=v%stepL===0; s+=`<line x1="${X(v)}" y1="${y-(big?7:4)}" x2="${X(v)}" y2="${y+(big?7:4)}" style="stroke:var(--ink);stroke-width:${v===0?3:1.5}"/>`; if(big) s+=T(X(v),y+20,N(v),{size:13,w:v===0?800:500}); }
  let at=o.start; const cols=["var(--xt)","var(--c3)","var(--c4)","var(--c2)"];
  if(o.start!=null) s+=`<circle cx="${X(o.start)}" cy="${y}" r="7" style="fill:var(--accent)"/>`;
  (o.jumps||[]).forEach((j,k)=>{
    const to=at+j, x1=X(at), x2=X(to), mid=(x1+x2)/2, top=y-26-Math.min(26,Math.abs(x2-x1)/6);
    const c=cols[k%cols.length];
    s+=`<path d="M${x1} ${y-6} Q${mid} ${top-12} ${x2} ${y-6}" style="fill:none;stroke:${c};stroke-width:2.5"/><path d="M${x2} ${y-6} l${x2>x1?-8:8} -6 l0 10 Z" style="fill:${c}"/>`;
    s+=T(mid,top-14,(j>0?"+":MINUS)+N(Math.abs(j)),{size:13,fill:c});
    at=to;
  });
  if(o.end!==false && o.jumps&&o.jumps.length) s+=`<rect x="${X(at)-7}" y="${y-7}" width="14" height="14" transform="rotate(45 ${X(at)} ${y})" style="fill:var(--good)"/>`;
  if(o.mark!=null) s+=`<circle cx="${X(o.mark)}" cy="${y}" r="7" style="fill:none;stroke:var(--bad);stroke-width:3"/>`;
  return vis(SV(W,hh,s,"number line"));
}

/* ---- area grid for brackets / multiplying ---- */
/* o: {left:"3", parts:["x","2"], prods:["3x","6"], hide:[false,true]} */
function areaGrid(o){
  const ws=o.parts.map(p=>/[a-z]/i.test(p)?120:70), hh=90, x0=56, y0=30, W=x0+ws.reduce((a,b)=>a+b,0)+12;
  let s=T(x0/2,y0+hh/2,o.left,{size:20,fill:"var(--c3)"}), x=x0;
  o.parts.forEach((p,i)=>{
    const col=[ "var(--xt)","var(--one)","var(--yt)"][i%3];
    s+=`<rect x="${x}" y="${y0}" width="${ws[i]}" height="${hh}" style="fill:color-mix(in srgb,${col} 18%,var(--surface));stroke:var(--ink);stroke-width:1.5"/>`;
    s+=T(x+ws[i]/2,y0-14,p,{size:17,fill:col});
    const pr=o.hide&&o.hide[i]?"?":o.prods[i];
    s+=T(x+ws[i]/2,y0+hh/2,pr,{size:19,style:"font-family:var(--f-display)"});
    x+=ws[i];
  });
  return vis(SV(W,y0+hh+8,s,"area grid"));
}

/* ---- balance scale ---- */
/* sides: arrays of "x" (mystery box), numbers (unit weights). */
function balanceSVG(L,R,o={}){
  const W=440, hh=250, cx=W/2, tilt=o.tilt||0, beamY=40, D=150;
  const ang=tilt*6;
  let s=`<path d="M${cx-40} ${hh-6} L${cx+40} ${hh-6} L${cx} ${beamY+6} Z" style="fill:var(--surface-2);stroke:var(--muted);stroke-width:2"/>`;
  s+=`<g transform="rotate(${ang} ${cx} ${beamY})"><rect x="${cx-190}" y="${beamY-5}" width="380" height="10" rx="5" style="fill:var(--muted)"/>`;
  const pan=(px,items)=>{
    let g=`<line x1="${px}" y1="${beamY}" x2="${px-50}" y2="${beamY+D}" style="stroke:var(--muted);stroke-width:1.5"/><line x1="${px}" y1="${beamY}" x2="${px+50}" y2="${beamY+D}" style="stroke:var(--muted);stroke-width:1.5"/><path d="M${px-70} ${beamY+D} L${px+70} ${beamY+D} Q${px+60} ${beamY+D+20} ${px} ${beamY+D+20} Q${px-60} ${beamY+D+20} ${px-70} ${beamY+D} Z" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>`;
    // items stacked above pan
    const boxes=items.filter(it=>it==="x").length; let units=0, blocks=[];
    items.forEach(it=>{ if(typeof it==="number"){ if(it<=15) units+=it; else blocks.push(it); } });
    let yy=beamY+D-2;
    // x boxes on the bottom row(s), 4 per row
    for(let i=0;i<boxes;i++){ const r=Math.floor(i/4), c=i%4, xx=px-62+c*32, by=beamY+D-2-30-r*32;
      g+=`<rect x="${xx}" y="${by}" width="30" height="30" rx="4" style="fill:color-mix(in srgb,var(--xt) 30%,var(--surface));stroke:var(--xt);stroke-width:2"/>`+T(xx+15,by+15,o.letter||"x",{fill:"var(--xt)",size:16}); }
    const boxRows=Math.ceil(boxes/4); let base=beamY+D-2-boxRows*32;
    let bx=px-62+(boxes%4&&boxRows===1?(boxes%4)*32:0);
    if(boxes&&boxes%4&&boxRows>=1){ bx=px-62+(boxes%4)*32; base=beamY+D-2-(boxRows-1)*32; }
    blocks.forEach(v=>{ g+=`<rect x="${bx}" y="${base-26}" width="40" height="26" rx="4" style="fill:color-mix(in srgb,var(--one) 45%,var(--surface));stroke:var(--one);stroke-width:2"/>`+T(bx+20,base-13,v,{size:13}); bx+=44; });
    let perRow=Math.floor((px+66-bx)/20);
    if(perRow<5&&units>perRow*2){ bx=px-62; base=beamY+D-2-boxRows*32-(blocks.length?28:0); perRow=6; }
    for(let i=0;i<units;i++){ const r=Math.floor(i/perRow), c=i%perRow; const ux=bx+c*20, uy=base-18-r*20;
      g+=`<rect x="${ux}" y="${uy}" width="18" height="18" rx="3" style="fill:color-mix(in srgb,var(--one) 45%,var(--surface));stroke:var(--one);stroke-width:1.5"/>`; }
    return g;
  };
  s+=pan(cx-150,L)+pan(cx+150,R)+`</g>`;

/* ---- patterns ---- */
const PATS={
  sq:{name:"squares made of matchsticks",a:3,b:1,stick:true},
  tri:{name:"triangles made of matchsticks",a:2,b:1,stick:true},
  sq2:{name:"two rows of squares made of matchsticks",a:5,b:2,stick:true},
};
function stickSVG(kind,n,o={}){
  const L=34; let s=""; const st=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c||"var(--c3)"};stroke-width:5;stroke-linecap:round"/>`;
  const first=o.colour?"var(--c4)":"var(--c3)";
  let W=0,hh=0; const ox=10, oy=10;
  if(kind==="sq"){ W=ox*2+n*L; hh=oy*2+L;
    s+=st(ox,oy,ox,oy+L,first);
    for(let i=0;i<n;i++){ const x=ox+i*L, c=o.colour?["var(--xt)","var(--c2)"][i%2]:undefined; s+=st(x,oy,x+L,oy,c)+st(x,oy+L,x+L,oy+L,c)+st(x+L,oy,x+L,oy+L,c); } }
  else if(kind==="tri"){ const hgt=L*0.87; W=ox*2+(n+1)*L/2+L/2; hh=oy*2+hgt;
    s+=st(ox,oy+hgt,ox+L/2,oy,first);
    for(let i=0;i<n;i++){ const c=o.colour?["var(--xt)","var(--c2)"][i%2]:undefined;
      if(i%2===0){ const x=ox+i*L/2; s+=st(x,oy+hgt,x+L,oy+hgt,c)+st(x+L,oy+hgt,x+L/2,oy,c); }
      else { const x=ox+(i-1)*L/2+L/2; s+=st(x,oy,x+L,oy,c)+st(x+L,oy,x+L/2,oy+hgt,c); } } }
  else if(kind==="sq2"){ W=ox*2+n*L; hh=oy*2+2*L;
    s+=st(ox,oy,ox,oy+L,first)+st(ox,oy+L,ox,oy+2*L,first);
    for(let i=0;i<n;i++){ const x=ox+i*L, c=o.colour?["var(--xt)","var(--c2)"][i%2]:undefined; s+=st(x,oy,x+L,oy,c)+st(x,oy+L,x+L,oy+L,c)+st(x,oy+2*L,x+L,oy+2*L,c)+st(x+L,oy,x+L,oy+L,c)+st(x+L,oy+L,x+L,oy+2*L,c); } }
  return {s,W,hh};
}
/* dots pattern: a·n + b → b grey dots then n columns of a coloured dots; quad: n×n square (+c grey) */
function dotSVG(a,b,n,o={}){
  const r=6, g=17; let s=""; let x=10;
  if(o.quad){ const k=o.k||1;
    for(let q=0;q<k;q++){ for(let i=0;i<n;i++) for(let j=0;j<n;j++) s+=`<circle cx="${x+r+i*g}" cy="${10+r+j*g}" r="${r}" style="fill:var(--x2t)"/>`; x+=n*g+10; }
    for(let i=0;i<b;i++) s+=`<circle cx="${x+r+(i%3)*g}" cy="${10+r+Math.floor(i/3)*g}" r="${r}" style="fill:var(--grey)"/>`;
    if(b>0) x+=Math.min(b,3)*g;
    return {s,W:x+10,hh:Math.max(n,Math.ceil(b/3))*g+20};
  }
  for(let i=0;i<b;i++) s+=`<circle cx="${x+r}" cy="${10+r+i*g}" r="${r}" style="fill:var(--grey)"/>`;
  if(b>0) x+=g+6;
  for(let c=0;c<n;c++){ for(let i=0;i<a;i++) s+=`<circle cx="${x+r+c*g}" cy="${10+r+i*g}" r="${r}" style="fill:${["var(--xt)","var(--c2)"][c%2]}"/>`; }
  x+=n*g;
  return {s,W:x+10,hh:Math.max(a,b)*g+20};
}
/* show shapes 1..k side by side with labels */
function patternRow(kind,k,o={}){
  let s="", x=0, maxH=0; const parts=[];
  for(let n=1;n<=k;n++){
    const p= kind.dots? dotSVG(kind.a,kind.b,n,kind) : stickSVG(kind,n,o);
    parts.push({p,n}); maxH=Math.max(maxH,p.hh); }
  for(const {p,n} of parts){ s+=`<g transform="translate(${x},0)">${p.s}${T(p.W/2,maxH+14,(o.lab||"Shape ")+n,{size:12,fill:"var(--muted)"})}</g>`; x+=p.W+18; }
  if(o.more) s+=T(x+10,maxH/2,"…",{size:24,fill:"var(--muted)"}), x+=30;
  return vis(SV(x,maxH+28,s,"pattern"));
}

/* ---- flowchart ---- */
/* nodes: {t:"start"|"stop"|"io"|"do"|"if", s:text, yes:text (side box), yesTo:index (where the yes box rejoins), back:index (loop: No → back up)} */
function flowSVG(nodes,cur){
  const W=470, cx=170, bh=40, gap=24; let y=10; const tops=[], hs=[];
  nodes.forEach(n=>{ const hh=n.t==="if"?60:bh; tops.push(y); hs.push(hh); y+=hh+gap; });
  const H=y-gap+12; let s="";
  const mid=i=>tops[i]+hs[i]/2;
  nodes.forEach((n,i)=>{
    const top=tops[i], hh=hs[i], on=cur===i, stroke=on?"var(--accent)":"var(--ink)", sw=on?3.5:1.6, fill=on?"var(--accent-soft)":"var(--surface)";
    if(n.t==="start"||n.t==="stop") s+=`<rect x="${cx-70}" y="${top}" width="140" height="${hh}" rx="20" style="fill:${fill};stroke:${stroke};stroke-width:${sw}"/>`;
    else if(n.t==="io") s+=`<path d="M${cx-90} ${top+hh} L${cx-70} ${top} L${cx+100} ${top} L${cx+80} ${top+hh} Z" style="fill:${fill};stroke:${stroke};stroke-width:${sw}"/>`;
    else if(n.t==="do") s+=`<rect x="${cx-95}" y="${top}" width="190" height="${hh}" rx="3" style="fill:${fill};stroke:${stroke};stroke-width:${sw}"/>`;
    else if(n.t==="if"){
      s+=`<path d="M${cx} ${top} L${cx+115} ${top+hh/2} L${cx} ${top+hh} L${cx-115} ${top+hh/2} Z" style="fill:${fill};stroke:${stroke};stroke-width:${sw}"/>`;
      if(n.yes!=null){ const on2=cur===i+0.5, by=top+hh/2;
        s+=`<path d="M${cx+115} ${by} L${cx+150} ${by}" style="stroke:var(--ink);stroke-width:1.6"/>`+T(cx+132,by-11,"Yes",{size:11,fill:"var(--good)"});
        s+=`<rect x="${cx+150}" y="${by-18}" width="140" height="36" rx="3" style="fill:${on2?"var(--accent-soft)":"var(--surface)"};stroke:${on2?"var(--accent)":"var(--ink)"};stroke-width:${on2?3.5:1.6}"/>`+T(cx+220,by,n.yes,{size:13});
        if(n.yesTo!=null){ const ty=mid(n.yesTo); s+=`<path d="M${cx+220} ${by+18} L${cx+220} ${ty} L${cx+104} ${ty}" style="fill:none;stroke:var(--ink);stroke-width:1.6"/><path d="M${cx+100} ${ty} l9 -5 l0 10 Z" style="fill:var(--ink)"/>`; }
        s+=T(cx+16,top+hh+9,"No",{size:11,fill:"var(--bad)"});
      } else if(n.back!=null) s+=T(cx+18,top+hh+9,"Yes",{size:11,fill:"var(--good)"});
    }
    s+=T(cx,top+hh/2,n.s,{size:n.t==="if"?13:14,w:n.t==="start"||n.t==="stop"?800:700});
    if(i<nodes.length-1) s+=`<path d="M${cx} ${top+hh} L${cx} ${top+hh+gap-6}" style="stroke:var(--ink);stroke-width:1.6"/><path d="M${cx} ${top+hh+gap-1} l-5 -8 l10 0 Z" style="fill:var(--ink)"/>`;
  });
  nodes.forEach((n,i)=>{ if(n.t==="if"&&n.back!=null){ const y1=mid(i), y2=mid(n.back);
    s+=`<path d="M${cx-115} ${y1} L${cx-140} ${y1} L${cx-140} ${y2} L${cx-102} ${y2}" style="fill:none;stroke:var(--c5);stroke-width:2"/><path d="M${cx-96} ${y2} l-9 -5 l0 10 Z" style="fill:var(--c5)"/>`+T(cx-146,(y1+y2)/2,"No",{size:11,fill:"var(--bad)",a:"end"}); } });
  return SV(W,H,s,"flowchart");
}

function numIn(val,min,max,onch){ const i=h("input",{type:"number",value:val,min,max,step:1}); i.addEventListener("input",()=>{ const v=parseInt(i.value,10); if(!isNaN(v)) onch(Math.max(min,Math.min(max,v))); }); return i; }

function NumberLineTool(init){
  let a=init?init.a:-3, op=init?init.op:"+", b=init?init.b:5;
  const out=h("div",{class:"out"}), pic=h("div"), why=h("div",{class:"why"});
  const sel=h("select",{},h("option",{value:"+"},"+  add"),h("option",{value:"-"},"−  subtract"),h("option",{value:"x"},"×  multiply"));
  sel.value=op; sel.addEventListener("change",()=>{op=sel.value;draw();});
  function draw(){
    let res, jumps, txt;
    if(op==="+"){ res=a+b; jumps=[b];
      txt= b>=0? `Start at ${N(a)}. Adding ${N(b)} means walk <b>right</b> ${N(b)}.` : `Start at ${N(a)}. Adding a negative means walk <b>left</b>. Walk left ${N(-b)}.`; }
    else if(op==="-"){ res=a-b; jumps=[-b];
      txt= b>=0? `Start at ${N(a)}. Subtracting ${N(b)} means walk <b>left</b> ${N(b)}.` : `Start at ${N(a)}. Subtracting a negative flips the direction: walk <b>right</b> ${N(-b)}. So ${N(a)} − (${N(b)}) is the same as ${N(a)} + ${N(-b)}.`; }
    else { res=a*b; const step=a, k=Math.abs(b); jumps=[]; for(let i=0;i<k&&i<12;i++) jumps.push(b<0?-step:step);
      txt= `${N(b)} × ${P(a)}: make ${k} jumps of ${N(Math.abs(a))}`+(b<0?`, but the negative sign turns you round`:"")+`. Times tables give the size (${Math.abs(a)} × ${k} = ${Math.abs(a*b)}), the signs give the direction.`; }
    const all=[a,res,0]; let pos=op==="x"?0:a; if(op==="x") for(const j of jumps){pos+=j;all.push(pos);}
    const min=Math.min(...all)-2, max=Math.max(...all)+2;
    pic.replaceChildren(numberLine({min,max,start:op==="x"?0:a,jumps}));
    out.textContent= op==="x"? `${N(b)} × ${P(a)} = ${N(res)}` : `${N(a)} ${op==="+"?"+":MINUS} ${P(b)} = ${N(res)}`;
    why.innerHTML=txt;
  }
  draw();
  return h("div",{class:"tool"},h("div",{class:"ctl"},"Start ",numIn(a,-20,20,v=>{a=v;draw();}),sel,numIn(b,-12,12,v=>{b=v;draw();})),h("div",{class:"scroll-x"},pic),out,why);
}

/* balance solver: ax + b = cx + d */
function BalanceTool(eq,onSolved){
  const start=eq||{a:2,b:3,c:0,d:11}; let st={...start}; const hist=[];
  const pic=h("div"), txt=h("div",{class:"qs"}), msg=h("div"), ctl=h("div",{class:"ctl"});
  const side=(k,n)=>{ const r=[]; for(let i=0;i<k;i++) r.push("x"); if(n) r.push(n); return r; };
  const eqText=()=>`${lin(st.a,"x",st.b)} = ${lin(st.c,"x",st.d)}`;
  function act(kind,v){
    const s={...st};
    if(kind==="sub1"){ if(Math.min(s.b,s.d)<v){ return note(`You can't take ${v} from both sides: one side hasn't got ${v} weights.`,"bad"); } s.b-=v; s.d-=v; hist.push(`Take ${v} from both sides`); }
    if(kind==="subx"){ if(Math.min(s.a,s.c)<1) return note("One side has no x boxes to take away.","bad"); s.a--; s.c--; hist.push("Take one x from both sides"); }
    if(kind==="div"){ if(s.a%v||s.b%v||s.c%v||s.d%v) return note(`Not everything on the scale splits into ${v} equal groups yet.`,"bad"); s.a/=v;s.b/=v;s.c/=v;s.d/=v; hist.push(`Split both sides into ${v} groups, keep one`); }
    st=s; draw();
  }
  function note(t,k){ msg.className="verdict "+(k||"mid"); msg.innerHTML=t; }
  function draw(){
    pic.replaceChildren(balance(side(st.a,st.b),side(st.c,st.d)));
    txt.textContent=eqText();
    msg.className=""; msg.textContent="";
    const solved=(st.a===1&&st.b===0&&st.c===0)||(st.c===1&&st.d===0&&st.a===0);
    ctl.replaceChildren();
    if(solved){ const v=st.a===1?st.d:st.b; note(`<b>Solved: x = ${N(v)}.</b> Every move kept the scale level, so x is still the same number it was at the start. Check: put ${N(v)} in place of x and both sides of ${lin(start.a,"x",start.b)} = ${lin(start.c,"x",start.d)} give ${N(start.a*v+start.b)}.`,"good"); if(onSolved) onSolved(v); }
    else {
      const small=Math.min(st.b,st.d);
      if(small>0) ctl.append(h("button",{class:"btn small",type:"button",onclick:()=>act("sub1",small)},`Take ${small} from both sides`));
      if(st.a>0&&st.c>0) ctl.append(h("button",{class:"btn small",type:"button",onclick:()=>act("subx")},"Take an x from both sides"));
      const k=st.a||st.c; if(k>1 && ((st.a===0&&st.b===0)||(st.c===0&&st.d===0)||small===0)) ctl.append(h("button",{class:"btn small",type:"button",onclick:()=>act("div",k)},`Split both sides into ${k} equal groups`));
    }
    ctl.append(h("button",{class:"btn small",type:"button",onclick:()=>{st={...start};hist.length=0;draw();}},"Start again"));
  }
  draw();
  return h("div",{class:"tool"},h("div",{class:"scroll-x"},pic),txt,ctl,msg);
}

function MachineTool(){
  let o1="×", n1=3, o2="+", n2=2, x=4, back=false;
  const pic=h("div",{class:"scroll-x"}), why=h("div",{class:"why"});
  const opSel=(v,f)=>{ const s=h("select",{},...["+","−","×","÷"].map(o=>h("option",{value:o},o))); s.value=v; s.addEventListener("change",()=>f(s.value)); return s; };
  const ap=(o,v,n)=>o==="+"?v+n:o==="−"?v-n:o==="×"?v*n:v/n;
  const inv={"+":"−","−":"+","×":"÷","÷":"×"};
  const btn=h("button",{class:"btn small",type:"button",onclick:()=>{back=!back;draw();}},"Run it backwards");
  function draw(){
    const m=ap(o1,x,n1), y=ap(o2,m,n2);

      why.innerHTML=`Forwards: ${N(x)} ${o1} ${n1} = ${N(+m.toFixed(3))}, then ${N(+m.toFixed(3))} ${o2} ${n2} = <b>${N(+y.toFixed(3))}</b>.`; btn.textContent="Run it backwards"; }
    else { pic.replaceChildren(machine({input:N(+y.toFixed(3)),ops:[inv[o2]+n2,inv[o1]+n1],output:N(x),mid:[N(+m.toFixed(3))]}));
      why.innerHTML=`Backwards: start from the output <b>${N(+y.toFixed(3))}</b>. Undo the <b>last</b> machine first (${o2}${n2} is undone by ${inv[o2]}${n2}), then undo the first (${o1}${n1} is undone by ${inv[o1]}${n1}). You get back to <b>${N(x)}</b>. Like taking off shoes before socks.`; btn.textContent="Run it forwards"; }
  }

  return h("div",{class:"tool"},h("div",{class:"ctl"},"Input ",numIn(x,-20,50,v=>{x=v;draw();})," Machine 1 ",opSel(o1,v=>{o1=v;draw();}),numIn(n1,1,12,v=>{n1=v;draw();})," Machine 2 ",opSel(o2,v=>{o2=v;draw();}),numIn(n2,1,20,v=>{n2=v;draw();})),pic,btn,why);
}

/* flowchart tracer: prog = {nodes, run: function(input) -> trace [{node, vars, out}]} */
function FlowTool(prog){
  let input=prog.input, trace=prog.run(input), k=0;
  const pic=h("div",{class:"scroll-x"}), info=h("div",{class:"why"}), outs=h("div",{class:"out"});
  const next=h("button",{class:"btn small primary",type:"button",onclick:()=>{ if(k<trace.length-1){k++;draw();} }},"Next step ▸");
  const reset=h("button",{class:"btn small",type:"button",onclick:()=>{k=0;draw();}},"Start again");
  function draw(){ const t=trace[k]; pic.replaceChildren(vis(flowSVG(prog.nodes,t.node))); info.innerHTML=t.note;
    const o=trace.slice(0,k+1).filter(s=>s.out!=null).map(s=>N(s.out)); outs.textContent= o.length? "Output so far: "+o.join(", ") : "No output yet";
    next.disabled=k>=trace.length-1; }
  draw();
  const ctl=prog.input!=null? h("div",{class:"ctl"},"Input ",numIn(input,1,40,v=>{input=v;trace=prog.run(input);k=0;draw();})) : null;
  return h("div",{class:"tool"},ctl,pic,h("div",{class:"ctl"},next,reset),info,outs);
}

  {t:"show",h:"A magic trick",b:`<p>Try this in your head:</p><ol><li>Think of a number.</li><li>Double it.</li><li>Add 10.</li><li>Halve it.</li><li>Take away the number you first thought of.</li></ol><p>Is your answer <b>5</b>? It is for everyone. Algebra explains why.</p>`},
  {t:"show",h:"Why it always works",b:`<p>Put your secret number in a bag, so nobody can see it. Call the bag <span class="x">n</span>.</p>`,v:()=>h("div",{class:"stack",style:"gap:4px;align-items:flex-start"},bags(["txt:Think of n:","bag:n"]),bags(["txt:Double:","bag:n","bag:n"]),bags(["txt:Add 10:","bag:n","bag:n","dots:10"]),bags(["txt:Halve:","bag:n","dots:5"]),bags(["txt:Take away n:","dots:5"])),
    after:`<p>Double: two bags. Add 10: two bags and 10 marbles. Halve: one bag and 5 marbles. Take away the bag: <b>5 marbles left</b>, whatever was in the bag.</p>`},
  {t:"show",h:"Words you'll hear in class",b:`<div class="kw">
    <div><b>Variable</b>A letter standing for a number, like <span class="x">n</span>.</div>
    <div><b>Term</b>One piece, like ${M("3n")} or ${M("5")}.</div>
    <div><b>Expression</b>Terms joined by + or −, like ${M("3n + 5")}. No = sign.</div>
    <div><b>Coefficient</b>The number in front of a letter. In ${M("3n")} it is 3.</div>
    <div><b>Like terms</b>Terms with exactly the same letters, like ${M("3n")} and ${M("7n")}.</div>
    <div><b>Expand</b>Multiply out a bracket: ${M("2(n + 4) = 2n + 8")}.</div>
    <div><b>Substitute</b>Swap a letter for a number.</div></div>`},
  {t:"show",h:"The big question of this unit",b:`<p>Your unit asks: <b>"How do we represent unknown information when solving problems?"</b></p><p><b>Ingenuity</b> means being clever and inventive. People invented letters for unknown numbers about 400 years ago, and it made hard problems much easier. Before that, mathematicians wrote everything out in long sentences.</p>`},
  {t:"try",h:"Have a go",b:`<p>A bag has <span class="x">n</span> marbles. You add 4 more marbles.</p>`,v:()=>bags(["bag:n","op:+","dots:4"]),q:{ask:"If n = 6, how many marbles are there altogether?",a:{num:10},why:"6 in the bag plus 4 loose ones is 10."}},
  {t:"try",h:"Have a go",b:`<p>Which one means "a number, then add 3"?</p>`,q:{choices:["3n","n + 3","n3"],ans:1,why:"n + 3 means the number, plus 3. 3n means 3 lots of n, which you'll meet in step 2."}},
]};

/* ---------- Step 1: a letter is a number ---------- */
STEPS.push({id:1,stage:1,big:true,title:"A letter is a number we don't know yet",short:"Letters are numbers",
 learn:[
  {t:"show",h:"The mystery bag",b:`<p>This bag has some marbles inside. We can't see how many.</p><p>Instead of saying "the number of marbles in the bag" every time, we give it a short name: <span class="x">n</span>.</p>`,v:()=>bags(["bag:n"]),rule:"A letter is just a number we don't know yet."},
  {t:"try",h:"Open the bag",b:`<p>We open the bag and count 5 marbles. So here <b>n = 5</b>.</p><p>Now there's a bag and 3 more marbles next to it.</p>`,v:()=>bags(["bag:n","op:+","dots:3"]),q:{ask:"How many marbles altogether?",a:{num:8},why:"The bag has 5, plus the 3 loose ones: 5 + 3 = 8. In algebra we write n + 3."}},
  {t:"show",h:"Same letter, same number",b:`<p>Two bags with the <b>same letter</b> always hold the <b>same amount</b>. That's the rule of algebra.</p><p>So <span class="x">n</span> + <span class="x">n</span> means two bags that match.</p>`,v:()=>bags(["bag:n","op:+","bag:n"]),rule:"Inside one problem, the same letter always means the same number."},
  {t:"try",h:"Two matching bags",b:`<p>n = 4. Two bags and one loose marble.</p>`,v:()=>bags(["bag:n","op:+","bag:n","op:+","dots:1"]),q:{ask:"How many marbles altogether?",a:{num:9},why:"Each bag has 4. 4 + 4 + 1 = 9."}},
  {t:"show",h:"Different letters",b:`<p>Different letters are different bags. <span class="x">a</span> and <span class="x">b</span> <i>might</i> hold different amounts, or they might happen to hold the same. We just don't know.</p>`,v:()=>bags(["bag:a","op:+","bag:b"])},
  {t:"show",h:"The letter can change between problems",b:`<p>In one problem n might be 5. In the next problem n might be 20. The letter is a <b>variable</b>: it can vary.</p><table class="tbl"><tr><th>n</th><td>1</td><td>2</td><td>5</td><td>10</td></tr><tr><th>n + 3</th><td>4</td><td>5</td><td>8</td><td>13</td></tr></table><p>The expression <b>n + 3</b> works like a recipe: whatever n is, add 3.</p>`},
  {t:"try",h:"Think of a number",b:`<p>"I think of a number and add 4. I get 11."</p>`,v:()=>bags(["bag:n","op:+","dots:4","txt:= 11"]),q:{ask:"What was in the bag?",a:{num:7},why:"The bag plus 4 makes 11, so the bag has 11 − 4 = 7. You've just solved your first equation!"}},
 ],
 gen:[()=>{ const k=ri(1,3), n=ri(2,9), c=ri(1,6); const items=[]; for(let i=0;i<k;i++){ if(i) items.push("op:+"); items.push("bag:n"); } items.push("op:+","dots:"+c);
   return {q:`Each bag holds <b>n = ${n}</b> marbles.<br>How many marbles altogether?`,v:()=>bags(items),
    steps:[{p:`How many marbles are in the ${k===1?"bag":k+" bags"}?`,a:{num:k*n},hint:k===1?`n = ${n}, so the bag holds ${n}.`:`Each bag holds ${n}. ${k} bags: ${k} × ${n}.`},
           {p:`Add the ${c} loose marble${c>1?"s":""}.`,a:{num:k*n+c},hint:`${k*n} + ${c}. Count on from ${k*n}.`}],
    final:{p:"Total:",a:{num:k*n+c}},why:`${k>1?k+" bags × "+n+" = "+k*n:"The bag holds "+n}, plus ${c} = ${k*n+c}.`}; },
  ()=>{ const n=ri(2,15), c=ri(2,9), tot=n+c; return {q:`"I think of a number and add ${c}. I get ${tot}." What is the number?`,v:()=>bags(["bag:n","op:+","dots:"+Math.min(c,9),"txt:= "+tot]),
    steps:[{p:`The bag and ${c} marbles make ${tot}. Take the ${c} away from ${tot}:`,a:{num:n},hint:`${tot} − ${c}. Count back ${c} from ${tot}, or think: ${c} + ? = ${tot}.`}],
    final:{p:"The number is:",a:{num:n}},why:`n + ${c} = ${tot}, so n = ${tot} − ${c} = ${n}.`}; }],
 checks:[
  {q:"In one problem, can n mean 3 on one line and 7 on the next line?",c:["Yes","No"],a:1,why:"Inside one problem the same letter always means the same number."},
  {q:"a and b are two different letters. Can they be the same number?",c:["Never","Yes, they can","Only if a = 1"],a:1,why:"Different letters are different bags. They might hold the same amount, but they don't have to."},
  {q:"Which one means 'a number plus 5'?",c:["5n","n + 5","n5"],a:1,why:"n + 5: the number, then 5 more."},
  {q:"A bag holds n marbles. Mia says 'n is always 5'. Is she right?",c:["Yes","No"],a:1,why:"n is a variable. It can be different numbers in different problems."},
  {q:"n = 6. What is n + n + n?",c:["666","18","9"],a:1,why:"Three bags of 6: 6 + 6 + 6 = 18."},
 ]});

/* ---------- Step 2: 3n means 3 lots of n ---------- */
STEPS.push({id:2,stage:1,big:true,title:"3n means 3 lots of n",short:"3n = 3 lots of n",

  {t:"show",h:"Three bags",b:`<p>Three bags that match: <span class="x">n</span> + <span class="x">n</span> + <span class="x">n</span>.</p><p>That's long to write, so we write <b>3n</b>. The number in front tells you <b>how many bags</b>.</p>`,v:()=>bags(["bag:n","bag:n","bag:n","txt:= 3n"]),rule:"3n means 3 × n: three lots of n."},
  {t:"show",h:"It's your times tables",b:`<p>If n = 7, then 3n = 3 × 7 = <b>21</b>.</p><p>No × sign is written. A number stuck to a letter always means <b>multiply</b>.</p>`,v:()=>bags(["bag:7","bag:7","bag:7","txt:= 21"])},
  {t:"try",h:"Your turn",b:`<p>n = 6.</p>`,v:()=>bags(["bag:n","bag:n","bag:n","bag:n"]),q:{ask:"What is 4n?",a:{num:24},why:"4 lots of 6 = 24."}},
  {t:"show",h:"3n is not n + 3",b:`<p>These look alike but they're different:</p>`,v:()=>h("div",{class:"stack"},bags(["txt:3n:","bag:n","bag:n","bag:n"]),bags(["txt:n + 3:","bag:n","op:+","dots:3"])),after:`<p><b>3n</b> is three bags. <b>n + 3</b> is one bag and three marbles.</p>`,rule:"3n is 3 × n. n + 3 is 3 more than n."},
  {t:"try",h:"Which is bigger?",b:`<p>n = 10.</p>`,q:{choices:["3n is bigger","n + 3 is bigger","They're equal"],ans:0,why:"3n = 30 and n + 3 = 13."}},
  {t:"try",h:"Now try n = 1",b:`<p>n = 1.</p>`,q:{choices:["3n is bigger","n + 3 is bigger","They're equal"],ans:1,why:"3n = 3 and n + 3 = 4. So which is bigger depends on n. That's why we can't treat them as the same."}},
  {t:"show",h:"Two letters next to each other",b:`<p><b>ab</b> means a × b. Think of a rectangle a long and b wide: its area is ab.</p><p><b>n²</b> ("n squared") means n × n: a square with sides n.</p>`,v:()=>areaGrid({left:"b",parts:["a"],prods:["ab"]}),rule:"Letters next to each other multiply. n² = n × n."},
  {t:"try",h:"Squares",b:`<p>n = 5.</p>`,q:{ask:"What is n²?",a:{num:25},why:"5 × 5 = 25. Not 10! n² is n × n, not 2 × n."}},
  {t:"show",h:"Dividing",b:`<p>Dividing is written as a fraction: <b>n/2</b> means n ÷ 2, half a bag.</p><p>If n = 12, n/2 = 6.</p>`},
 ],
 gen:[()=>{ const n=ri(2,9), k=ri(2,9), c=ri(1,9), t=pick(["k","plus","sq"]);
   if(t==="k") return {q:`n = ${n}. What is <b>${k}n</b>?`,v:()=>bags(Array(Math.min(k,6)).fill("bag:n").concat(k>6?["txt:…"]:[])),steps:[{p:`${k}n means ${k} lots of n. Write it as a times: ${k} × ${n} =`,a:{num:k*n},hint:`Your ${k} times table: ${k} × ${n}.`}],final:{p:`${k}n =`,a:{num:k*n}},why:`${k} × ${n} = ${k*n}.`};
   if(t==="plus") return {q:`n = ${n}. What is <b>n + ${c}</b>?`,v:()=>bags(["bag:n","op:+","dots:"+c]),steps:[{p:`n + ${c} means one bag and ${c} more. ${n} + ${c} =`,a:{num:n+c},hint:`Count on ${c} from ${n}.`}],final:{p:`n + ${c} =`,a:{num:n+c}},why:`${n} + ${c} = ${n+c}. Not ${c} × ${n}!`};
   return {q:`n = ${n}. What is <b>n²</b>?`,v:()=>areaGrid({left:"n",parts:["n"],prods:["n²"]}),steps:[{p:`n² means n × n. ${n} × ${n} =`,a:{num:n*n},hint:`It's a square: ${n} rows of ${n}. Your ${n} times table.`}],final:{p:"n² =",a:{num:n*n}},why:`${n} × ${n} = ${n*n}.`}; },
  ()=>{ const a=ri(2,9), b=ri(2,9), k=ri(2,5); return {q:`a = ${a} and b = ${b}. What is <b>${k}ab</b>?`,steps:[{p:`ab means a × b: ${a} × ${b} =`,a:{num:a*b},hint:`Times tables: ${a} × ${b}.`},{p:`Now ${k} lots of that: ${k} × ${a*b} =`,a:{num:k*a*b},hint:`${k} × ${a*b}. Split it: ${k} × ${Math.floor(a*b/10)*10} and ${k} × ${a*b%10}.`}],final:{p:`${k}ab =`,a:{num:k*a*b}},why:`${k} × ${a} × ${b} = ${k*a*b}.`}; }],
 checks:[
  {q:"'3n is bigger than n + 3.'",c:ASN,a:1,why:"Sometimes. When n = 10, 3n = 30 is bigger. When n = 1, 3n = 3 is smaller than 4."},
  {q:"'5n means 5 lots of n.'",c:ASN,a:0,why:"Always. A number in front of a letter means multiply."},
  {q:"n = 4. Sam says n² = 8. What went wrong?",c:["He did 2 × 4 instead of 4 × 4","He added instead of subtracting","Nothing, he's right"],a:0,why:"n² means n × n = 16, not 2 × n."},
  {q:"What does xy mean?",c:["x + y","x × y","x then y as a two-digit number"],a:1,why:"Letters next to each other multiply."},
  {q:"n = 2. Which two expressions are equal?",c:["n² and 2n","3n and n + 3","n + 1 and 2n"],a:0,why:"2² = 4 and 2 × 2 = 4. They're equal only when n is 0 or 2, so n² and 2n are still different expressions."},
 ]});

/* ---------- Step 3: negatives as moves ---------- */
STEPS.push({id:3,stage:1,big:true,title:"Negatives are moves on a number line",short:"Negatives as moves",
 learn:[
  {t:"show",h:"Numbers live on a line",b:`<p>Numbers to the right are bigger. Numbers to the left are smaller. Left of zero are the <b>negative</b> numbers: −1, −2, −3…</p><p>Think of a lift: 0 is the ground floor, −2 is two floors below ground.</p>`,v:()=>numberLine({min:-6,max:6})},
  {t:"show",h:"Adding means walk right",b:`<p>−3 + 5: start at −3 and walk <b>right</b> 5 steps. You land on <b>2</b>.</p>`,v:()=>numberLine({min:-5,max:5,start:-3,jumps:[5]}),rule:"+ a positive: walk right."},
  {t:"show",h:"Subtracting means walk left",b:`<p>2 − 6: start at 2 and walk <b>left</b> 6 steps. You land on <b>−4</b>.</p><p>Tip: cross zero first. 2 − 2 gets you to 0, then 4 more steps left takes you to −4.</p>`,v:()=>numberLine({min:-6,max:4,start:2,jumps:[-2,-4]}),rule:"− a positive: walk left."},
  {t:"try",h:"Your turn",b:`<p>Start at −4. Walk right 7.</p>`,v:()=>numberLine({min:-6,max:6,start:-4}),q:{ask:"−4 + 7 =",a:{num:3},why:"4 steps right gets to 0, then 3 more gets to 3."}},
  {t:"try",h:"Your turn",b:`<p>Start at 3. Walk left 8.</p>`,v:()=>numberLine({min:-7,max:5,start:3}),q:{ask:"3 − 8 =",a:{num:-5},why:"3 steps left gets to 0, then 5 more gets to −5."}},
  {t:"show",h:"Adding a negative",b:`<p>5 + (−3). The negative sign means "the other way". So instead of walking right, you walk <b>left</b> 3.</p><p>5 + (−3) = 5 − 3 = <b>2</b>.</p>`,v:()=>numberLine({min:-1,max:7,start:5,jumps:[-3]}),rule:"+ (−3) is the same as − 3."},
  {t:"show",h:"Subtracting a negative",b:`<p>2 − (−4). Subtracting means walk left, but the negative turns you round. Two "turn rounds" face you forwards again, so walk <b>right</b> 4.</p><p>2 − (−4) = 2 + 4 = <b>6</b>.</p><p>Real life: if someone takes away a debt of 4 dirhams, you're 4 dirhams better off.</p>`,v:()=>numberLine({min:-1,max:8,start:2,jumps:[4]}),rule:"− (−4) is the same as + 4."},
  {t:"tool",h:"Play with it",b:`<p>Change the numbers and watch the jumps. Try some subtractions of negatives.</p>`,tool:()=>NumberLineTool({a:2,op:"-",b:-4})},
  {t:"show",h:"Multiplying with negatives",b:`<p>Use your times tables for the size, then decide the sign.</p><p>3 × (−4) is three jumps of −4: you land on <b>−12</b>.</p><p>(−3) × (−4) = <b>12</b>. Two negatives cancel out, like two "turn rounds".</p>`,v:()=>numberLine({min:-13,max:1,start:0,jumps:[-4,-4,-4]}),rule:"Same signs → positive. Different signs → negative."},
  {t:"try",h:"Squaring a negative",b:`<p>(−5)² means (−5) × (−5).</p>`,q:{ask:"(−5)² =",a:{num:25},why:"5 × 5 = 25 from your times tables. Same signs, so positive: 25. You'll need this in step 8."}},
 ],
 gen:[()=>{ const t=pick(["add","sub","addneg","subneg"]); let a=ri(-8,8), b=ri(1,9);
   if(t==="add"){ if(a>=0) a=-ri(1,8); return {q:`Work out <b>${N(a)} + ${b}</b>`,v:()=>numberLine({min:Math.min(a,0)-1,max:Math.max(a+b,0)+1,start:a}),steps:[{p:"Which way do you walk?",a:{choice:["Right","Left"],ans:0},hint:"Adding a positive number: walk right."},{p:`Start at ${N(a)}, walk right ${b}. Where do you land?`,a:{num:a+b},hint:`Walk to 0 first (${-a} steps), then ${b+a>0?"the "+(b+a)+" steps left over":"you run out before 0"}.`,hv:()=>numberLine({min:Math.min(a,0)-1,max:Math.max(a+b,0)+1,start:a,jumps:[b]})}],final:{p:`${N(a)} + ${b} =`,a:{num:a+b}},why:`Start at ${N(a)}, walk right ${b}: ${N(a+b)}.`}; }
   if(t==="sub"){ a=ri(-5,8); return {q:`Work out <b>${N(a)} − ${b}</b>`,v:()=>numberLine({min:Math.min(a-b,0)-1,max:Math.max(a,0)+1,start:a}),steps:[{p:"Which way do you walk?",a:{choice:["Right","Left"],ans:1},hint:"Subtracting a positive number: walk left."},{p:`Start at ${N(a)}, walk left ${b}. Where do you land?`,a:{num:a-b},hint:a>0&&b>a?`Walk ${a} steps to 0, then ${b-a} more to ${N(a-b)}.`:`Count back ${b} from ${N(a)}.`,hv:()=>numberLine({min:Math.min(a-b,0)-1,max:Math.max(a,0)+1,start:a,jumps:[-b]})}],final:{p:`${N(a)} − ${b} =`,a:{num:a-b}},why:`${N(a)} walk left ${b}: ${N(a-b)}.`}; }
   if(t==="addneg") return {q:`Work out <b>${N(a)} + (${N(-b)})</b>`,v:()=>numberLine({min:Math.min(a-b,0)-1,max:Math.max(a,0)+1,start:a}),steps:[{p:`Adding a negative is the same as…`,a:{choice:[`${N(a)} + ${b}`,`${N(a)} − ${b}`],ans:1},hint:"The negative sign turns you round: walk left."},{p:`${N(a)} − ${b} =`,a:{num:a-b},hint:`Start at ${N(a)}, walk left ${b}.`,hv:()=>numberLine({min:Math.min(a-b,0)-1,max:Math.max(a,0)+1,start:a,jumps:[-b]})}],final:{p:`${N(a)} + (${N(-b)}) =`,a:{num:a-b}},why:`+ (−${b}) is the same as − ${b}: ${N(a-b)}.`};
   return {q:`Work out <b>${N(a)} − (${N(-b)})</b>`,v:()=>numberLine({min:Math.min(a,0)-1,max:Math.max(a+b,0)+1,start:a}),steps:[{p:`Subtracting a negative is the same as…`,a:{choice:[`${N(a)} + ${b}`,`${N(a)} − ${b}`],ans:0},hint:"Subtract turns you round, and the negative turns you round again: walk right."},{p:`${N(a)} + ${b} =`,a:{num:a+b},hint:`Start at ${N(a)}, walk right ${b}.`,hv:()=>numberLine({min:Math.min(a,0)-1,max:Math.max(a+b,0)+1,start:a,jumps:[b]})}],final:{p:`${N(a)} − (${N(-b)}) =`,a:{num:a+b}},why:`− (−${b}) is the same as + ${b}: ${N(a+b)}.`}; },
  ()=>{ const a=nz(-9,9), b=nz(-9,9); const sq=Math.random()<.3; const A=sq?a:a, B=sq?a:b;
   const q= sq?`(${N(A)})²`:`${P(A)} × ${P(B)}`;
   return {q:`Work out <b>${q}</b>`,steps:[{p:`Ignore the signs. ${Math.abs(A)} × ${Math.abs(B)} =`,a:{num:Math.abs(A*B)},hint:`Times tables: ${Math.abs(A)} × ${Math.abs(B)}.`},{p:"Are the signs the same or different?",a:{choice:["Same → answer positive","Different → answer negative"],ans:(A<0)===(B<0)?0:1},hint:`${N(A)} is ${A<0?"negative":"positive"}, ${N(B)} is ${B<0?"negative":"positive"}.`}],final:{p:`${q} =`,a:{num:A*B}},why:`${Math.abs(A*B)}, and the signs are ${(A<0)===(B<0)?"the same, so positive":"different, so negative"}: ${N(A*B)}.`}; }],
 checks:[
  {q:"Which is the same as 6 − (−2)?",c:["6 − 2","6 + 2","−6 − 2"],a:1,why:"Subtracting a negative turns you round twice: walk right. 6 + 2 = 8."},
  {q:"−3 − 4: which way do you walk from −3?",c:["Right, to 1","Left, to −7","Left, to −1"],a:1,why:"Subtracting 4 means walk left 4: −3 → −7."},
  {q:"'A negative times a negative is positive.'",c:ASN,a:0,why:"Always. Same signs give a positive."},
  {q:"Lily says (−4)² = −16. What's wrong?",c:["Nothing","(−4) × (−4) has the same signs, so it's +16","It should be −8"],a:1,why:"Same signs → positive: 16."},
  {q:"Which number is smaller?",c:["−8","−3"],a:0,why:"−8 is further left on the number line, so it's smaller."},
  {q:"'Adding a number always makes it bigger.'",c:ASN,a:1,why:"Sometimes. Adding a negative makes it smaller: 5 + (−2) = 3."},
 ]});

/* ---------- Step 4: writing expressions ---------- */
const WORDS=[["more than","+"],["plus","+"],["increased by","+"],["less than","− (careful with the order)"],["take away / minus","−"],["times / lots of / product","×"],["twice / double","× 2"],["shared between / divided by","÷"],["squared","²"]];
STEPS.push({id:4,stage:1,title:"Writing expressions from words",short:"Words → algebra",root:1,
 learn:[
  {t:"show",h:"Turning words into algebra",b:`<p>An <b>expression</b> is a short way of writing a calculation that has a mystery number in it.</p><p>"Oliver has some stickers and gets 5 more" becomes <b>s + 5</b>.</p>`,v:()=>bags(["bag:s","op:+","dots:5"])},
  {t:"show",h:"Word bank",b:`<table class="tbl">${WORDS.map(w=>`<tr><th style="text-align:left">${w[0]}</th><td>${w[1]}</td></tr>`).join("")}</table>`,rule:"Find the operation word first, then write it."},
  {t:"show",h:"Watch out: 'less than' flips",b:`<p>"5 less than n" means start with n and take 5 away: <b>n − 5</b>.</p><p>It does <b>not</b> mean 5 − n. If n = 12, 5 less than 12 is 7, and 12 − 5 = 7. ✓</p>`,v:()=>bags(["bag:n","op:−","neg:5"]),rule:"'5 less than n' → n − 5. Test it with a number."},
  {t:"try",h:"Your turn",b:`<p>Pencils cost 3 dirhams each. Oliver buys <b>p</b> pencils.</p>`,q:{ask:"Write an expression for the total cost.",a:{expr:"3p"},why:"p lots of 3 dirhams: 3 × p = 3p."}},
  {t:"try",h:"Your turn",b:`<p>"A number, doubled, then add 1." Call the number n.</p>`,v:()=>bags(["bag:n","bag:n","op:+","dots:1"]),q:{ask:"Write the expression.",a:{expr:"2n+1"},why:"Doubled: 2n. Then add 1: 2n + 1."}},

/* ---------- Step 5: like terms ---------- */
STEPS.push({id:5,stage:1,title:"Collecting like terms",short:"Like terms",root:2,
 learn:[
  {t:"show",h:"Algebra tiles",b:`<p>We'll use tiles. A long blue bar is <span class="x">x</span>. A green bar is <b style="color:var(--yt)">y</b>. A small yellow square is <b>1</b>.</p>`,v:()=>tiles([{v:"x",c:1},{v:"y",c:1},{v:"",c:1}])},

  {t:"show",h:"Different shapes stay apart",b:`<p>3x + 2y: you can't join an x bar and a y bar into one shape. The answer stays <b>3x + 2y</b>.</p>`,v:()=>tiles([{v:"x",c:3},{v:"y",c:2}]),rule:"3x + 2y can't be made shorter. It is NOT 5xy."},
  {t:"try",h:"Your turn",b:``,v:()=>tiles([{v:"x",c:4},{v:"",c:2},{v:"x",c:1},{v:"",c:3}]),q:{ask:"Write these tiles as short as possible.",a:{expr:"5x+5",simp:true,terms:2},why:"4x + x = 5x and 2 + 3 = 5. So 5x + 5."}},
  {t:"show",h:"Negative tiles",b:`<p>A red tile is a negative. A positive x and a negative x cancel out to zero, like +1 and −1.</p><p>5x − 2x: five blue, two red. Pair them up: <b>3x</b> left.</p>`,v:()=>tiles([{v:"x",c:5},{v:"x",c:-2}]),rule:"Each red tile cancels one tile of the same shape."},
  {t:"try",h:"Your turn",b:`<p>Collect: 6y + 4 − 2y − 1</p>`,v:()=>tiles([{v:"y",c:6},{v:"",c:4},{v:"y",c:-2},{v:"",c:-1}]),q:{ask:"Answer:",a:{expr:"4y+3",simp:true,terms:2},why:"6y − 2y = 4y. 4 − 1 = 3. So 4y + 3."}},
  {t:"show",h:"Each term keeps its sign",b:`<p>The sign <b>in front</b> of a term belongs to it. In 7a + 3b <b>− 2a</b>, the −2a is negative.</p><p>Group: 7a − 2a = 5a. The 3b stays. Answer: <b>5a + 3b</b>.</p>`,rule:"Draw a circle round each term, including the sign before it."},

  {t:"try",h:"Which are like terms?",b:``,q:{choices:["3ab and 5ba","2x and 2x²","4y and 4"],ans:0,why:"ab and ba are the same (a × b = b × a), so 3ab + 5ba = 8ab."}},
 ],
 gen:[()=>{ const L1=pick(["x","a","m"]), L2=pick(["y","b","n"]); let a1=ri(1,7),a2=nz(-5,6),b1=ri(1,6),b2=nz(-4,5),c1=ri(1,9),c2=nz(-6,6);
   const useB=Math.random()<.6, useC=Math.random()<.7||!useB;
   const order=shuffle([{c:a1,v:L1},{c:a2,v:L1},...(useB?[{c:b1,v:L2},{c:b2,v:L2}]:[]),...(useC?[{c:c1,v:""},{c:c2,v:""}]:[])]);
   if(order[0].c<0) order.push(order.shift());
   const q=terms(order);
   const A=a1+a2,B=useB?b1+b2:0,C=useC?c1+c2:0;
   const ans=terms([{c:A,v:L1},{c:B,v:L2},{c:C,v:""}]);
   const nT=[A,B,C].filter(Boolean).length||1;
   const steps=[{p:`Collect the <b>${L1}</b> terms: ${a1>0?"":""}${terms([{c:a1,v:L1}])} and ${terms([{c:a2,v:L1}])} make…`,a:{expr:`${A}${L1}`},hint:`Count the ${L1} tiles: ${a1} ${a2<0?"take away "+(-a2):"and "+a2}.`,hv:()=>tiles([{v:L1,s:"x",c:a1},{v:L1,s:"x",c:a2}])}];
   if(useB) steps.push({p:`Collect the <b>${L2}</b> terms: ${terms([{c:b1,v:L2}])} and ${terms([{c:b2,v:L2}])} make…`,a:{expr:`${B}${L2}`},hint:`${b1} ${b2<0?"take away "+(-b2):"and "+b2}.`,hv:()=>tiles([{v:L2,s:"y",c:b1},{v:L2,s:"y",c:b2}])});
   if(useC) steps.push({p:`Collect the numbers: ${N(c1)} and ${N(c2)} make…`,a:{num:C},hint:c2<0?`${c1} − ${-c2}: walk left from ${c1}.`:`${c1} + ${c2}.`,hv:()=>numberLine({min:Math.min(0,c1+c2,c1)-1,max:Math.max(c1,c1+c2)+1,start:c1,jumps:[c2]})});
   return {q:`Simplify <b>${q}</b>`,steps,final:{p:"Simplified:",a:{expr:ans,simp:true,terms:nT}},why:`Group the same letters: ${ans}.`}; }],
 checks:[

  {q:"Which pair are like terms?",c:["2xy and 7yx","3x and 3y","x² and 2x"],a:0,why:"xy and yx are the same (x × y = y × x)."},

  {t:"show",h:"Undoing × is your times tables",b:`<p>The ×4 machine turns 7 into 28.</p><p>To undo it, ask: <b>4 × ? = 28</b>. Your times tables say 7. That's ÷ 4.</p>`,v:()=>machine({input:"7",ops:["×4"],output:"28"})},

function progLinear(a,b,inp){ const nodes=[{t:"start",s:"Start"},{t:"io",s:"Input n"},{t:"do",s:`Multiply by ${a}`},{t:"do",s:`${b<0?"Subtract "+(-b):"Add "+b}`},{t:"io",s:"Output the answer"},{t:"stop",s:"Stop"}];
  return {nodes,input:inp,run(x){ const m=x*a, y=m+b; return [{node:0,note:"Start at the top."},{node:1,note:`The input is ${x}.`},{node:2,note:`${x} × ${a} = ${m}`},{node:3,note:`${m} ${b<0?MINUS:"+"} ${Math.abs(b)} = ${y}`},{node:4,note:`Output ${y}.`,out:y},{node:5,note:"Stop. It's the function machine ×"+a+" then "+(b<0?MINUS:"+")+Math.abs(b)+"."}]; }}; }
function progDecide(lim,sub,addv,inp){ const nodes=[{t:"start",s:"Start"},{t:"io",s:"Input n"},{t:"if",s:`Is n bigger than ${lim}?`,yes:`Subtract ${sub}`,yesTo:4},{t:"do",s:`Add ${addv}`},{t:"io",s:"Output n"},{t:"stop",s:"Stop"}];
  return {nodes,input:inp,run(x){ const big=x>lim, y=big?x-sub:x+addv; return [{node:0,note:"Start."},{node:1,note:`The input is ${x}.`},{node:2,note:`Is ${x} bigger than ${lim}? <b>${big?"Yes":"No"}</b>.`},big?{node:2.5,note:`Yes branch: ${x} − ${sub} = ${y}`}:{node:3,note:`No branch: ${x} + ${addv} = ${y}`},{node:4,note:`Output ${y}.`,out:y},{node:5,note:"Stop."}]; }}; }
function progLoop(s,d,lim){ const nodes=[{t:"start",s:"Start"},{t:"do",s:`n = ${s}`},{t:"io",s:"Output n"},{t:"do",s:`Add ${d} to n`},{t:"if",s:`Is n bigger than ${lim}?`,back:2},{t:"stop",s:"Stop"}];
  return {nodes,input:null,run(){ const tr=[{node:0,note:"Start."},{node:1,note:`n starts at ${s}.`}]; let n=s, guard=0;
    for(;;){ tr.push({node:2,note:`Output ${n}.`,out:n}); n+=d; tr.push({node:3,note:`n is now ${n}.`}); const stop=n>lim; tr.push({node:4,note:`Is ${n} bigger than ${lim}? <b>${stop?"Yes":"No"}</b>${stop?"":", so loop back up"}.`}); if(stop||++guard>20) break; }
    tr.push({node:5,note:"Stop. The outputs make a sequence!"}); return tr; }}; }

function checkEq(want,got){
  const g=String(got).replace(/[−–]/g,"-"); if(!g.includes("=")) return {ok:false,msg:"Write it as an equation, with an = sign."};

function AnswerBox(spec,label,onOk,onWrong,onReveal,opts={}){
  /* returns element; spec.choice → buttons */
  const el=h("div",{class:"stack",style:"gap:8px"}), fb=h("div");
  let tries=0;
  const max=opts.max||2;
  if(label) el.append(h("div",{html:label,style:"font-weight:700"}));
  if(spec.choice){
    const opts2=h("div",{class:"opts"+(spec.choice.some(c=>c.length>16)?" col":"")});
    spec.choice.forEach((c,k)=>opts2.append(h("button",{class:"opt",type:"button",onclick:e=>{ const b=e.currentTarget;
      if(k===spec.ans){ b.classList.add("ok"); opts2.querySelectorAll("button").forEach(x=>x.disabled=true); fb.replaceChildren(); onOk(tries); }
      else { b.classList.add("no"); b.disabled=true; tries++; onWrong&&onWrong(tries,fb); if(tries>=max){ opts2.children[spec.ans].classList.add("ok"); opts2.querySelectorAll("button").forEach(x=>x.disabled=true); onReveal&&onReveal(fb); } } }},c)));
    el.append(opts2,fb); return el;
  }
  const inp=h("input",{class:"ans",type:"text",autocomplete:"off",spellcheck:"false","aria-label":"Answer"});
  const btn=h("button",{class:"btn primary",type:"button"},"Check");
  const ans=spec.expr!=null? spec.expr.replace(/\^2/g,"²").replace(/-/g," − ").replace(/\+/g," + ").replace(/\*/g,"") : spec.num!=null? N(spec.num) : "";
  const doCheck=()=>{ const r=checkAns(spec,inp.value); if(r.empty) return;
    if(r.ok){ inp.classList.remove("no"); inp.classList.add("ok"); inp.disabled=true; btn.disabled=true; fb.replaceChildren(); onOk(tries); return; }
    inp.classList.add("no"); if(!r.close) tries++;

    if(!r.close){ onWrong&&onWrong(tries,fb,r); if(tries>=max){ inp.value=ans; inp.disabled=true; btn.disabled=true; onReveal&&onReveal(fb,ans); } } };
  btn.addEventListener("click",doCheck); inp.addEventListener("keydown",e=>{ if(e.key==="Enter") doCheck(); }); inp.addEventListener("input",()=>inp.classList.remove("no"));
  el.append(h("div",{class:"ansrow"},inp,btn)); if(spec.expr!=null) el.append(SymKeys(inp)); el.append(fb);
  setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} },30);

function runSteps(q,body,done){
  let k=0, helped=false, revealed=false;

    const st=all[k];

    const hintArea=h("div");
    box.append(AnswerBox(st.a,st.p,()=>{ box.classList.add("done"); hintArea.replaceChildren(); k++; if(k<all.length) addStep(); else finish(); },
      (tries,fb)=>{ helped=true; fb.className=""; fb.replaceChildren(); if(st.hint||st.hv){ hintArea.replaceChildren(h("div",{class:"hintbox"},h("div",{},h("b",{},"💡 Hint: "),H(st.hint||"Have another go.")),st.hv?st.hv():null)); } else { fb.className="verdict bad"; fb.textContent="Not quite. Have another go."; } },
      (fb,ans)=>{ revealed=true; fb.className="verdict mid"; fb.innerHTML=`<b>The answer is ${esc(ans||"shown above")}.</b> Look at how it was worked out, then carry on.`; box.classList.add("done"); setTimeout(()=>{ k++; if(k<all.length) addStep(); else finish(); },50); }));
    box.append(hintArea);
    body.append(box);
  }
  function finish(){ body.append(h("div",{class:"verdict "+(revealed?"mid":"good"),html:`<b>${revealed?"Done.":helped?"Got there!":"All steps right!"}</b> ${q.why||""}`})); done(revealed?"wrong":helped?"help":"steps"); }

function runOwn(q,body,report){

    (tries,fb)=>{ fb.className="verdict bad"; fb.textContent="Not quite. Try once more, or use steps."; },
    (fb,ans)=>{ stepsBtn.remove(); fb.className="verdict mid"; fb.innerHTML=`<b>The answer is ${esc(ans)}.</b> ${q.why||""}`; report("wrong"); });

function checkOk(id){ const s=stepById(id); if(!s.checks||!s.checks.length) return true; const c=S.checks[id]; return !!(c&&c.last>=0.75); }
function ragOf(id){
  const s=stepById(id);
  if(s.kind==="exam"){ const e=S.exams[S.exams.length-1]; if(!e) return {st:S.learnDone[id]?"started":"none",n:0}; const p=e.score/e.total; return {st:p>=0.8?"green":p>=0.5?"amber":"red",n:1,pct:p}; }
  const a=(S.hist[id]||[]).slice(-6);
  if(!a.length) return {st:(S.learnDone[id]||S.learned[id]>0)?"started":"none",n:0,own:0};
  const pts=a.map(x=>PTS[x.r]??1), avg=pts.reduce((p,q)=>p+q,0)/pts.length;
  const last5=a.slice(-5), own=last5.filter(x=>x.r==="own").length, stp=last5.filter(x=>x.r==="steps").length, last=a[a.length-1].r;
  const ck=checkOk(id);

const RAG_LABEL={green:"I can do it on my own",amber:"Getting there",red:"I need to go back over this",none:"Not started",started:"Started"};
function ragReason(id){

  if(r.st==="none") return "Not started yet.";
  if(r.st==="started") return "You've started the ideas. Now try some questions.";
  if(r.st==="green") return `${r.own} of your last ${Math.min(5,r.n)} right on your own, and you passed the understanding check.`;
  if(r.st==="red") return s.root? `Most recent tries went wrong. Go back to step ${s.root} first, then come back.` : "Most recent tries went wrong. Watch the ideas again, then use steps.";
  if(r.own>=3&&!r.ck) return "Nearly! Pass the understanding check to turn it green.";
  if(r.stp>=2&&r.own===0) return "You can do it with steps. Now try some on your own.";
  return r.toGreen? `${r.toGreen} more right on your own will help turn it green.` : "Keep the next few right to turn it green.";

const Keep=(()=>{

  const dirty=()=>(S.updated||0)>(S.backupAt||0);

  function toast(t,bad){ const el=h("div",{class:"toast"+(bad?" bad":"")},t); document.body.append(el); setTimeout(()=>el.remove(),4200); }

      const r=await Family.save(GAME,S,u);

    }catch(e){ err="offline"; }

  function changed(){ clearTimeout(timer); timer=setTimeout(writeNow,600); }
